<!doctype html><html><meta charset="utf-8"><title>Orb before and after</title>
<!-- 1280 x 800: today on the left, the proposal on the right, the same seeded run. ?scene=dock|room|sidebar|torture -->
<style>html,body{margin:0;background:#000}iframe{border:0;width:639px;height:800px;float:left}iframe+iframe{margin-left:2px}</style>
<body><script>
const q = Object.fromEntries(new URLSearchParams(location.search)), sc = q.scene || 'dock';
const T = {
  dock: ['Today: the dock as boopis draws it', 'calm idle, drawn at 80 and scaled; hover listens and blinks', 'Proposed: fixed at rest, alive under the pointer', 'the 3/4 pose; hover wakes a bot lively; working and needs you animate'],
  room: ['Today: the room', 'presence lively, the gutter calm', 'Proposed: the chat fully lively', 'every orb lively; they look at the composer and the new message'],
  sidebar: ['Today: the Bots sidebar', '20 px rows, calm idle', 'Proposed: fixed, alive in a state', '28 px rows and a 44 px main bot at the 3/4 pose; kai works, nina needs you'],
  trans: ['Grok-Bot', 'the owner\'s drop video', 'orb3: rest, hover, rest, working, rest', 'K08 B: the home pose; a hover wakes it at 2 s, home at 5.5 s; working at 8 s, home at 11 s'],
  look: ['Grok-Bot', 'the owner\'s drop video', 'orb3: looking around', 'pose, head turn and nod, lively idle, working, pose'],
  torture: ['Today: orb2 as shipped', 'every shape through its whole turn range, then spins', 'Proposed: the fixed geometry (G1-G3)', 'convex bodies traced as hulls; the eyes kept on the face'] }[sc];
const extra = Object.entries(q).filter(([k]) => k !== 'scene').map(([k, v]) => `&${k}=${encodeURIComponent(v)}`).join('');   /* probe switches, passed to both halves */
const u = (lib, plan, t, s) => `stage.html?scene=${sc}&lib=${lib}&plan=${plan}&title=${encodeURIComponent(t)}&sub=${encodeURIComponent(s)}${extra}`;
const RL = q.right || 'tuned';   /* ?right=orb3: the proposal drawn by orb3; ?solo=1: only the right half (the left is left black for a reference video) */
document.body.innerHTML = (q.solo ? '<iframe style="visibility:hidden"></iframe>' : `<iframe src="${u('stock', 'today', T[0], T[1])}"></iframe>`) + `<iframe src="${u(RL, 'more', T[2], T[3])}"></iframe>`;
window.go = () => { for (const f of document.querySelectorAll('iframe')) if (f.contentWindow.go) f.contentWindow.go(); };
window.ready = () => [...document.querySelectorAll('iframe[src]')].every((f) => f.contentDocument && f.contentDocument.body && f.contentDocument.body.dataset.ready);
</script></body></html>
