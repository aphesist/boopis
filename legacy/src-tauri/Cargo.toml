[package]
name = "hypotaxis-desktop"
version = "0.1.0"
description = "Sovereign Rust Coding Harness on Hermes & Contraprova"
authors = ["aphesist <126630868+aphesist@users.noreply.github.com>"]
edition = "2021"

[lib]
name = "hypotaxis_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
hypotaxis-contracts = { workspace = true }
contraprova-kernel = { workspace = true }
turn-primitives = { workspace = true }
hermes-bridge = { workspace = true }
compat-loader = { workspace = true }
local-artifacts = { workspace = true }
apple-vm = { workspace = true }
