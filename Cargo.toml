[workspace]
resolver = "2"
members = [
  "crates/hypotaxis-contracts",
  "crates/contraprova-kernel",
  "crates/turn-primitives",
  "crates/hermes-bridge",
  "crates/compat-loader",
  "crates/local-artifacts",
  "crates/apple-vm",
  "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["aphesist <126630868+aphesist@users.noreply.github.com>"]

[workspace.dependencies]
hypotaxis-contracts = { path = "crates/hypotaxis-contracts" }
contraprova-kernel = { path = "crates/contraprova-kernel" }
turn-primitives = { path = "crates/turn-primitives" }
hermes-bridge = { path = "crates/hermes-bridge" }
compat-loader = { path = "crates/compat-loader" }
local-artifacts = { path = "crates/local-artifacts" }
apple-vm = { path = "crates/apple-vm" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
thiserror = "2"
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
globset = "0.4"
ignore = "0.4"
regex = "1"
axum = "0.7"
