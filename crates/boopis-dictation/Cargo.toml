[package]
name = "boopis-dictation"
description = "Dictation for the boopis desktop host: the microphone through the system's audio API, and speech to text on this computer with whisper.cpp. No network but the one-time fetch of the speech model; no audio on disk."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
hex.workspace = true
sha2.workspace = true
thiserror.workspace = true
tracing.workspace = true
url = "2"
# The microphone: ALSA on Linux (PipeWire and PulseAudio answer as its default device), WASAPI on Windows, Core Audio on
# macOS. No JACK, PulseAudio or PipeWire backend of its own. Apache-2.0.
cpal = { version = "=0.18.2", default-features = false }
# whisper.cpp 1.8.3 (MIT), built from source by whisper-rs-sys with CMake, on the CPU: no GPU, CoreML, OpenBLAS or OpenMP
# feature. The two binding crates are Unlicense, a public-domain dedication (ADR-0059 admits it for them). Its log lines go
# to `tracing`. How it is compiled for every processor: `.cargo/config.toml` at the repository root.
whisper-rs = { version = "=0.16.0", default-features = false, features = ["tracing_backend"] }

# The resampling to the model's 16 kHz: an FFT resampler with its own anti-aliasing filter. MIT or Apache-2.0; realfft and
# rustfft, which it brings, are MIT or Apache-2.0 too.
rubato = "=0.16.2"

# macOS: whether the person has allowed the microphone, and the system's own question when they have not been asked yet
# (AVCaptureDevice's authorization status; `capture::access`). The objc2 crates are already in the tree through cpal; only
# AVFoundation's bindings are new. MIT.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSBundle"] }
block2 = "0.6"
objc2-av-foundation = { version = "=0.3.2", default-features = false, features = ["std", "AVCaptureDevice", "AVMediaFormat", "block2"] }

[dev-dependencies]
tempfile.workspace = true
# Reads the test recording (tests/speech.rs). Apache-2.0; not in the app.
hound = "=3.5.1"
