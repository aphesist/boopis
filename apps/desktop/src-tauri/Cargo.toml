[package]
name = "boopis-host"
description = "The boopis desktop host: the machine authority (Hermes lifecycle, gateway proxy, keychain, OS integration) of the Tauri app."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[lib]
name = "boopis_host"
path = "src/lib.rs"

[[bin]]
name = "boopis"
path = "src/main.rs"

[features]
# Test doubles (an in-memory secret store, a scripted gateway) for integration tests and local runs. Never a fallback.
dev-fixtures = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-specta = { version = "=2.0.0-rc.29", features = ["derive", "typescript"] }
specta = { version = "=2.0.0-rc.28", features = ["serde_json"] }
specta-typescript = "0.0.15"
tauri-plugin-store = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
# One boopis per user (B28): a second launch hands its arguments to the running app, which shows its window, and exits before
# it starts anything. Without it the second instance took over and the first one's shutdown deleted the Local API files. Its
# dependencies are already in the tree (zbus on Linux, windows-sys on Windows); MIT or Apache-2.0.
tauri-plugin-single-instance = "2.5"
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "net", "fs"] }
tokio-util.workspace = true
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
async-trait = "0.1"
keyring = "4"
url = "2"
uuid.workspace = true
subtle = "2"
getrandom = "0.3"
hex.workspace = true
sha2.workspace = true
dirs = "6"
# Unpacking the bundled Hermes runtime (ADR-0023): a .tar.zst, hashed while it is read. MIT or Apache-2.0 both; zstd-sys
# builds the BSD-licensed C library.
tar = { version = "0.4", default-features = false }
# The store's staging (ADR-0038): GitHub's tarballs are gzip, and a zip's entries (an MCP bundle, an `archive` source) are raw
# deflate, read by the store's own bounded zip reader. Already in the tree (through the HTTP stack); MIT or Apache-2.0.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
zstd = { version = "0.13", default-features = false }
# Every HTTPS request of the host (the sign-ins, the provider checks, the store), blocking (run on `spawn_blocking`). rustls with
# ring, which every agent names (src/tls.rs: with `rustls-no-provider` an agent that names none panics), and the operating
# system's trust store (no bundled root list), so a company's own certificate authority works. On Windows the system's proxy
# setting is read too (`win-system-proxy`: the Internet Options proxy, as the environment's HTTPS_PROXY is everywhere). MIT or
# Apache-2.0; ring is Apache-2.0 and ISC.
ureq = { version = "3.4", default-features = false, features = ["rustls-no-provider", "platform-verifier", "win-system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# Checking the signature of OpenAI's ID token (RS256) against its published keys (the Sign in with ChatGPT program asks for
# it). Already in the tree through rustls; Apache-2.0 and ISC.
ring = { version = "0.17", default-features = false, features = ["std"] }
serde_norway = "0.9.42"

# The Linux webview (ADR-0025): GDK's monitor refresh rate and the web view's settings object, through safe wrappers, and
# `dlsym` for the one preference the `webkit2gtk` crate has no binding for. Versions match what Tauri's wry already uses.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
webkit2gtk = { version = "2.0", features = ["v2_34"] }
libc = "0.2"

# Attaching to the parent console for `boopis --version` and `boopis doctor`: the release binary is a GUI-subsystem one.
# Already in the tree (through Tauri); only the console feature is added.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "net", "fs", "test-util"] }
