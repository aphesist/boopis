<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>boopis</title>
<link rel="icon" href="data:,">
</head>
<body>
<div id="hx-app" class="hx ui-root is-booting" data-tab="session" data-left="open" data-right="closed" data-dock="on">

  <!-- the floating chrome (DESIGN-SYSTEM.md v7 7, 19; the kit's WindowChrome, drawn by the shell at boot): no bar, a 56 px drag region -->
  <header class="hx-bar" id="hx-chrome" data-tauri-drag-region="deep"></header>

  <aside class="hx-side" id="hx-side" aria-label="Sessions and bots">
    <div class="hx-side__inner">

      <!-- the open sidebar's head: the Sessions / Bots pill and New (screen 13); the kit's, drawn by the shell -->
      <div class="hx-side__head">
        <div class="hx-side__open">
          <div class="hx-seg-slot" id="hx-seg"></div>
          <div id="hx-btn-new"></div>
        </div>
      </div>

      <div id="hx-sidebar-list" class="hx-side__list">
        <div class="hx-list ui-scroll ui-scroll--stable is-active" data-list="session" id="hx-list-session" role="tabpanel" aria-labelledby="hx-tab-session"></div>
        <div class="hx-list ui-scroll ui-scroll--stable" data-list="bots" id="hx-list-bots" role="tabpanel" aria-labelledby="hx-tab-bots" inert></div>
      </div>

      <!-- you, Store and Settings at the foot (screen 12); the kit's, drawn by the shell -->
      <div class="hx-foot" id="hx-foot"></div>
    </div>
    <!-- the rail (sidebar collapsed): the bots' tiles, the kit's Rail, drawn by the bots module (DESIGN-SYSTEM.md v7 7, 21.2 row 40) -->
    <div class="hx-rail" id="hx-rail" aria-hidden="true"></div>
  </aside>

  <main class="hx-ground" id="hx-ground">
    <section class="hx-view is-active" id="hx-view-session" data-view="session" aria-label="Session" role="tabpanel"></section>
    <section class="hx-view" id="hx-view-bots" data-view="bots" aria-label="Bot chat" role="tabpanel" inert></section>
  </main>

  <aside class="hx-right" id="hx-right-shell" aria-label="Session details">
    <div id="hx-right" class="hx-right__slot"></div>
  </aside>

  <div id="hx-dock" class="hx-dock-slot"></div>

  <div class="hx-scrim" id="hx-scrim" hidden></div>

  <div class="hx-palette" id="hx-palette" role="dialog" aria-modal="true" aria-label="Search and commands" hidden>
    <div class="hx-palette__box ui-nest">
      <div id="hx-palette-input"></div>
      <div class="hx-palette__list ui-scroll ui-scroll--stable ui-scroll--inset-end" id="hx-palette-list" role="listbox" aria-label="Results"></div>
    </div>
  </div>

  <!-- Settings: the kit's large dialog (board 14, S39), drawn into this <dialog> by modules/settings -->
  <dialog class="hx-dialog hx-settings" id="hx-settings" aria-label="Settings"></dialog>

  <dialog class="hx-dialog hx-store-dialog" id="hx-store" aria-labelledby="hx-store-title">
    <div class="hx-dialog__card ui-nest">
      <header class="hx-dialog__head">
        <h2 id="hx-store-title">Store</h2>
        <button class="ui-ib ui-corner" type="button" id="hx-store-close" aria-label="Close the store" data-tip="Close" data-kbd="esc"><span data-icon="close"></span></button>
      </header>
      <div class="hx-dialog__body ui-scroll ui-scroll--stable ui-scroll--inset-end" tabindex="0" role="region" aria-labelledby="hx-store-title" id="hx-store-body"></div>
    </div>
  </dialog>

  <dialog class="hx-dialog hx-keysheet" id="hx-keys-sheet" aria-labelledby="hx-keys-title">
    <div class="hx-dialog__card ui-nest">
      <header class="hx-dialog__head">
        <h2 id="hx-keys-title">Keyboard shortcuts</h2>
        <div id="hx-keys-filter"></div>
        <button class="ui-ib ui-corner" type="button" id="hx-keys-close" aria-label="Close keyboard shortcuts" data-tip="Close" data-kbd="esc"><span data-icon="close"></span></button>
      </header>
      <div class="hx-dialog__body ui-scroll ui-scroll--stable ui-scroll--inset-end" tabindex="0" role="region" aria-labelledby="hx-keys-title">
        <div class="hx-keys-grid" id="hx-keys-body"></div>
        <p class="hx-keys-note">Keys shown for this computer. In a web browser a few belong to the browser (F6, and Alt+1 or Alt+2 on Linux); every action is also in the palette.</p>
      </div>
    </div>
  </dialog>
  <div class="hx-goto" id="hx-goto" role="status" hidden></div>
  <!-- the floating Notice's layer (kit.notify): a v7 root, on the column's centre line at the top of the work -->
  <div class="hx-notify" id="hx-notify" data-notify-host></div>
  <div class="ui-sr" id="hx-sr" aria-live="polite"></div>
</div>

<div class="hx-probe" aria-hidden="true">
  <i data-probe="sb" style="width:var(--sb-w)"></i><i data-probe="rail" style="width:var(--sb-rail-w)"></i>
  <i data-probe="right" style="width:var(--right-w)"></i><i data-probe="rrail" style="width:var(--right-rail-w)"></i>
  <i data-probe="col" style="width:var(--col-w)"></i><i data-probe="chrome" style="width:var(--chrome-h)"></i>
  <i data-probe="dock" style="width:var(--dock-rest-h)"></i>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
