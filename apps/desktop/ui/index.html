<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>hypotaxis</title>
<link rel="icon" href="data:,">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <symbol id="i-phi-closed" viewBox="139.19 40.89 724.12 918.22"><path fill="currentColor" d="M480.7 277.7 522.6 219.3 533.7 209.4 545.1 204.2 574.2 198.3 600.4 199 642 203.7 677.5 212.8 704.7 226.3 724.9 245 801.8 366.4 820.4 405 827.9 441.4 829.3 464.1 827.7 489.6 815.1 551.7 793.2 627.9 774.8 659.8 711.9 742.9 688.2 763.9 668.1 776.7 651.2 784.3 633.3 789.3 604.4 792.8 550 804.2 512.2 807.5 476.7 806.1 423.1 799.7 382.6 788.8 353.5 776.2 328 761.7 298.8 738.2 271.9 711.8 250.4 687.2 226.2 653.6 212.1 632.4 193.8 596.6 184.8 537.2 173.9 490.6 173.2 469.5 178.8 440.2 222.2 349.8 246.6 306 274.7 266.9 307 234.7 329.2 218.5 353.4 205.6 379.7 197.2 409.8 192.5 451.9 191.6 591.7 198.5 651 205.4 671.7 210.8 694.2 220.1 712 231.8 724.9 245 753.8 291.9 776.1 335.8 784.6 366.2 786.4 380.5 784.6 390.2 780.3 392.2 771.4 390.8 737.4 370.9 706.4 357.1 694.8 346.9 682.2 325.1 668 310.4 649.2 298 628.3 289.2 587.1 279.6 499.2 269.9 438.1 258.8 414.8 256.7 394.2 258.3 379.9 263 365.6 273.3 326.5 314.5 312.3 340.3 301.7 375.2 289.3 444.8 286.2 475.3 286.2 505.3 291.5 538.4 299.8 562.3 312.3 614.7 320.4 634.7 349 677.6 387.9 724.1 407.8 741 424.9 750.6 453.5 761.6 475.2 764.9 510 766.2 544.5 762.5 575.5 753.4 606 749.3 626.6 741.7 653.1 726.1 678.4 701.8 694.4 681.2 705.2 662.6 715.1 636.7 729.7 551.6 734.3 476 733.8 459.9 728 430 701.1 372.2 688.2 334.9 677.8 319.8 660.8 305 643.1 295 617.6 286 559.2 275.6 532 265 523.1 267.1 505.9 278.5ZM481.9 925.1 477.1 917.9 470.8 878.9 465 804.9 467.5 732.9 465.5 674.9 470 598.9 469.9 588.9 466.2 579.9 469.5 523.9 465.5 445.9 470 372.9 464 280.9 464 237.9 468.6 171.9 472.4 158.9 487 121.9 511.3 83.9 520.8 74.9 526.4 82.9 534 121.9 539.1 164.9 534.5 207.9 534.5 231.9 539.5 311.9 532 391.9 531.5 418.9 533.5 496.9 539.9 580.9 536 589.9 534 624.9 538.3 633.9 532 679.9 537.5 770.9 532.7 819.9 520.7 860.9 509.2 885.9 490.8 915.9Z"/></symbol>
    <symbol id="i-phi" viewBox="0 0 27 36"><path fill-rule="evenodd" d="M13.5 4.3c7.3 0 13.3 6.1 13.3 13.7S20.8 31.7 13.5 31.7.2 25.6.2 18 6.2 4.3 13.5 4.3Zm.6 2.4c-4.4.1-8.6 4.9-8.6 11.3s4.2 11.4 8.6 11.3c4.5-.1 8.4-5 8.4-11.3S18.6 6.6 14.1 6.7Z"/><path d="M13.9.2l1.2 4.2-.2 23.4-.6 7.9-.9.1-.6-8.1.1-23.3L13.2.4Z"/></symbol>
  </defs>
</svg>

<div id="hx-app" class="hx ui-root is-booting" data-tab="session" data-left="open" data-right="closed" data-dock="on">

  <header class="hx-bar" data-tauri-drag-region>
    <div class="hx-bar__lead">
      <span class="hx-mark" role="img" aria-label="hypotaxis"><svg class="hx-mark__closed" aria-hidden="true"><use href="#i-phi-closed"/></svg><svg class="hx-mark__open" aria-hidden="true"><use href="#i-phi"/></svg></span>
      <button class="ui-ib" id="hx-btn-left" type="button" aria-controls="hx-side" aria-expanded="true" data-tip="Hide sidebar" data-kbd="mod+B"><span data-icon="sidebar-left"></span></button>
      <button class="ui-ib" id="hx-btn-back" type="button" aria-label="Back" data-tip="Back" data-kbd="mod+[" disabled><span data-icon="back"></span></button>
      <button class="ui-ib" id="hx-btn-fwd" type="button" aria-label="Forward" data-tip="Forward" data-kbd="mod+]" disabled><span data-icon="forward"></span></button>
    </div>

    <button class="hx-cmd" id="hx-btn-search" type="button" aria-haspopup="dialog" aria-expanded="false" aria-label="Search and commands">
      <span data-icon="search"></span>
      <span class="hx-cmd__where"><span class="hx-cmd__project" id="hx-where-project"></span> <span class="hx-cmd__title" id="hx-where-title"></span></span>
      <kbd data-kbd="mod+K"></kbd>
    </button>

    <div class="hx-bar__end">
      <button class="ui-ib" id="hx-btn-right" type="button" aria-controls="hx-right-shell" aria-expanded="false" data-tip="Show session details" data-kbd="mod+I"><span data-icon="sidebar-right"></span></button>
      <div class="hx-win" role="group" aria-label="Window">
        <button class="ui-ib ui-ib--window" id="hx-btn-min" type="button" aria-label="Minimize" data-tip="Minimize"><span data-icon="minimize"></span></button>
        <button class="ui-ib ui-ib--window" id="hx-btn-max" type="button" aria-label="Full screen" data-tip="Full screen"><span data-icon="maximize"></span></button>
        <button class="ui-ib ui-ib--window" id="hx-btn-close" type="button" aria-label="Close window" data-tip="Close window"><span data-icon="close"></span></button>
      </div>
    </div>
  </header>

  <aside class="hx-side" id="hx-side" aria-label="Sessions and bots">
    <div class="hx-side__inner">

      <div class="hx-seg-slot" id="hx-seg"></div>

      <button class="ui-btn ui-btn--ghost hx-new" id="hx-btn-new" type="button" aria-keyshortcuts="Control+Shift+O"><span data-icon="plus"></span><span class="hx-new__label">New session</span><span class="ui-btn__kbd"><kbd data-kbd="mod+shift+O"></kbd></span></button>

      <div class="hx-rail" aria-hidden="true">
        <div class="hx-rail__seg-slot" id="hx-rail-seg"></div>
        <button class="ui-ib hx-rail__new" type="button" data-tip="New session" data-kbd="mod+shift+O" data-tip-pos="right"><span data-icon="plus"></span></button>
      </div>

      <div id="hx-sidebar-list" class="hx-side__list">
        <div class="hx-list is-active" data-list="session" id="hx-list-session" role="tabpanel" aria-labelledby="hx-tab-session"></div>
        <div class="hx-list" data-list="bots" id="hx-list-bots" role="tabpanel" aria-labelledby="hx-tab-bots" inert></div>
      </div>

      <div class="hx-foot">
        <button class="hx-me" id="hx-btn-account" type="button" aria-haspopup="menu" aria-expanded="false" data-tip-pos="right">
          <span class="hx-avatar" aria-hidden="true"></span> <span class="hx-me__name" id="hx-account-name"></span>
        </button>
        <button class="ui-ib hx-foot__gear" id="hx-btn-settings" type="button" aria-label="Settings" aria-haspopup="dialog" data-tip="Settings" data-kbd="mod+,"><span data-icon="gear"></span></button>
      </div>
    </div>
  </aside>
  <div class="hx-corner hx-corner--left ui-concave" data-at="tl" aria-hidden="true"></div>

  <main class="hx-ground" id="hx-ground">
    <section class="hx-view is-active" id="hx-view-session" data-view="session" aria-label="Session" role="tabpanel"></section>
    <section class="hx-view" id="hx-view-bots" data-view="bots" aria-label="Bot chat" role="tabpanel" inert></section>
  </main>

  <aside class="hx-right" id="hx-right-shell" aria-label="Session details">
    <div id="hx-right" class="hx-right__slot"></div>
  </aside>
  <div class="hx-corner hx-corner--right ui-concave" data-at="tr" aria-hidden="true"></div>

  <div id="hx-dock" class="hx-dock-slot"></div>

  <div class="hx-scrim" id="hx-scrim" hidden></div>

  <div class="hx-palette" id="hx-palette" role="dialog" aria-modal="true" aria-label="Search and commands" hidden>
    <div class="hx-palette__box">
      <div class="hx-palette__field">
        <span data-icon="search"></span>
        <input id="hx-palette-input" type="text" role="combobox" aria-label="Search sessions, bots and commands" aria-expanded="true" aria-controls="hx-palette-list" aria-autocomplete="list" autocomplete="off" spellcheck="false" placeholder="Search sessions, bots and commands">
        <span class="ui-keys hx-palette__esc" aria-hidden="true"><kbd class="ui-kbd">esc</kbd></span>
      </div>
      <div class="hx-palette__list" id="hx-palette-list" role="listbox" aria-label="Results"></div>
    </div>
  </div>

  <dialog class="hx-dialog" id="hx-settings" aria-labelledby="hx-settings-title">
    <div class="hx-dialog__card">
      <header class="hx-dialog__head">
        <h2 id="hx-settings-title">Settings</h2>
        <div class="hx-dtabs" role="tablist" aria-label="Settings sections">
          <button type="button" class="hx-dtab" role="tab" id="hx-dtab-general" aria-controls="hx-dpanel-general" aria-selected="true" data-section="general">General</button>
          <button type="button" class="hx-dtab" role="tab" id="hx-dtab-appearance" aria-controls="hx-dpanel-appearance" aria-selected="false" data-section="appearance" tabindex="-1">Appearance</button>
          <button type="button" class="hx-dtab" role="tab" id="hx-dtab-keys" aria-controls="hx-dpanel-keys" aria-selected="false" data-section="keys" tabindex="-1">Keyboard</button>
        </div>
        <button class="ui-ib" type="button" id="hx-settings-close" aria-label="Close settings" data-tip="Close" data-kbd="esc"><span data-icon="close"></span></button>
      </header>
      <div class="hx-dialog__body">
        <div class="hx-dpanel" id="hx-dpanel-general" role="tabpanel" aria-labelledby="hx-dtab-general">
          <section class="hx-set" aria-labelledby="hx-set-layout">
            <h3 class="ui-set__head" id="hx-set-layout">Layout</h3>
            <div class="ui-set__row">
              <label class="ui-set__label" for="hx-set-dock"><span>Show the dock</span><small>Bots and widgets at the bottom edge. Everything in it is also in the sidebar.</small></label>
              <input class="ui-switch" type="checkbox" id="hx-set-dock" role="switch" data-ui="switch" checked>
            </div>
            <div class="ui-set__row">
              <span class="ui-set__label" id="hx-set-collapse-l"><span>When the sidebar collapses</span><small>A rail keeps the tabs and the new button in reach.</small></span>
              <div id="hx-set-collapse"></div>
            </div>
          </section>
        </div>
        <div class="hx-dpanel" id="hx-dpanel-appearance" role="tabpanel" aria-labelledby="hx-dtab-appearance" hidden></div>
        <div class="hx-dpanel" id="hx-dpanel-keys" role="tabpanel" aria-labelledby="hx-dtab-keys" hidden>
          <section class="hx-set" id="hx-set-keys" aria-labelledby="hx-set-keys-h">
            <h3 class="ui-set__head" id="hx-set-keys-h">Keyboard shortcuts</h3>
            <div class="hx-keys" id="hx-keys"></div>
          </section>
        </div>
      </div>
    </div>
  </dialog>

  <dialog class="hx-dialog hx-keysheet" id="hx-keys-sheet" aria-labelledby="hx-keys-title">
    <div class="hx-dialog__card">
      <header class="hx-dialog__head">
        <h2 id="hx-keys-title">Keyboard shortcuts</h2>
        <input class="ui-input hx-keys-filter" id="hx-keys-filter" type="text" placeholder="Filter" aria-label="Filter shortcuts" autocomplete="off" spellcheck="false">
        <button class="ui-ib" type="button" id="hx-keys-close" aria-label="Close keyboard shortcuts" data-tip="Close" data-kbd="esc"><span data-icon="close"></span></button>
      </header>
      <div class="hx-dialog__body" tabindex="0" role="region" aria-labelledby="hx-keys-title">
        <div class="hx-keys-grid" id="hx-keys-body"></div>
        <p class="hx-keys-note">Keys shown for this computer. In a web browser a few belong to the browser (F6, and Alt+1 or Alt+2 on Linux); every action is also in the palette.</p>
      </div>
    </div>
  </dialog>
  <div class="hx-goto" id="hx-goto" role="status" hidden></div>
  <div class="ui-sr" id="hx-sr" aria-live="polite"></div>
</div>

<div class="hx-probe" aria-hidden="true">
  <i data-probe="sb" style="width:var(--sb-w)"></i><i data-probe="rail" style="width:var(--sb-rail-w)"></i>
  <i data-probe="right" style="width:var(--right-w)"></i><i data-probe="rrail" style="width:var(--right-rail-w)"></i>
  <i data-probe="col" style="width:var(--col-w)"></i><i data-probe="chrome" style="width:var(--chrome-h)"></i>
  <i data-probe="dock" style="width:var(--dock-rest-h)"></i>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
