name: build the AppImage
description: >
  The Linux release build: hx (release), the bundle staged with the Hermes runtime, the Tauri AppImage, and the file
  with its checksum collected in dist/. Shared by release.yml's `linux` job and ci.yml's `desktop-smoke` pipeline, so the
  AppImage CI smoke-tests is built the way the one a release ships is. The caller checks out the repository, downloads the
  `hermes-runtime-linux-x86_64` artifact and uploads dist/ itself. Runs on ubuntu-22.04 (the oldest glibc and WebKitGTK
  4.1 the app needs, so the AppImage runs on every newer distro).
inputs:
  runtime-dir:
    description: The directory holding the downloaded Hermes runtime (hermes-runtime-linux-x86_64.tar.zst and runtime.json).
    required: true
runs:
  using: composite
  steps:
    - name: Tauri's Linux prerequisites and the AppImage tools
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
          build-essential pkg-config libfuse2 patchelf file xdg-utils
    - uses: dtolnay/rust-toolchain@1.97.0
      with:
        components: clippy, rustfmt
    - uses: Swatinem/rust-cache@v2
      with: { shared-key: release-linux }
    - uses: pnpm/action-setup@v4
      with: { version: 10 }
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm
        cache-dependency-path: apps/desktop/ui/pnpm-lock.yaml
    - run: pnpm install --frozen-lockfile
      shell: bash
      working-directory: apps/desktop/ui
    - name: build hx (release), the sidecar
      shell: bash
      run: cargo build --release -p hx
    - name: stage the hx sidecar, the plugin and the Hermes runtime (scripts/stage-bundle.sh)
      shell: bash
      env:
        RUNTIME_DIR: ${{ inputs.runtime-dir }}
      run: scripts/stage-bundle.sh --hx target/release/hx --runtime "$RUNTIME_DIR"
    - name: build the AppImage (release, x86_64-unknown-linux-gnu) with the bundle config
      shell: bash
      working-directory: apps/desktop/src-tauri
      env:
        NO_STRIP: "true"  # linuxdeploy's bundled strip chokes on newer ELF sections
      run: pnpm dlx @tauri-apps/cli@2 build --bundles appimage --target x86_64-unknown-linux-gnu --config tauri.bundle.conf.json
    - name: collect the AppImage and its checksum
      shell: bash
      env:
        RUNTIME_DIR: ${{ inputs.runtime-dir }}
      run: |
        mkdir -p dist
        cp target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage dist/
        cd dist && sha256sum -- *.AppImage | tee SHA256SUMS
        {
          echo "AppImage: $(stat -c %s -- *.AppImage) bytes"
          echo "of which the Hermes runtime archive: $(jq .archive.size "$RUNTIME_DIR/runtime.json") bytes (carried once, already compressed)"
        } | tee -a "$GITHUB_STEP_SUMMARY"
