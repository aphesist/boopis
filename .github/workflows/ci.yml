name: ci
# The gate (docs/STANDARDS.md section 10): every push and every pull request. Jobs run in parallel and are cached.
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # The toolchain CI builds with (see docs/RELEASING.md). RUSTUP_TOOLCHAIN overrides rust-toolchain.toml's "stable".
  RUSTUP_TOOLCHAIN: "1.97.0"
  # ubuntu-22.04 on purpose: hx-sandbox needs unprivileged user namespaces, which 24.04 restricts with AppArmor.
  # The sysctl step below keeps these jobs working if the image moves to 24.04.

jobs:
  identity:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: every commit is the owner's alone, with no attribution lines
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            # a new branch or a rewritten one: check what it adds on top of develop (or main)
            base=$(git merge-base HEAD origin/develop 2>/dev/null || git merge-base HEAD origin/main 2>/dev/null || git rev-list --max-parents=0 HEAD | tail -1)
          fi
          echo "checking $base..HEAD"
          sh scripts/check-commit-identity.sh "$base..HEAD"

  checks:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: shared data files are copies of their sources (ADR-0016)
        run: scripts/sync-shared-data.sh --check
      - name: generated hx types match the schema
        run: python3 scripts/gen-hx-types.py --check
      - name: vendored contraprova is a byte-exact copy of its pinned commit (ADR-0015)
        # The source repository may be private: add the repository secret CONTRAPROVA_TOKEN (a fine-grained,
        # read-only token for aphesist/contraprova). Without it the default public URL is tried.
        env:
          CONTRAPROVA_TOKEN: ${{ secrets.CONTRAPROVA_TOKEN }}
        run: |
          if [ -n "$CONTRAPROVA_TOKEN" ]; then
            echo "::add-mask::$CONTRAPROVA_TOKEN"
            export CONTRAPROVA_REPO="https://x-access-token:${CONTRAPROVA_TOKEN}@github.com/aphesist/contraprova.git"
          fi
          scripts/vendor-contraprova.sh --check

  rust:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Tauri's Linux prerequisites (the host is part of the workspace)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev build-essential pkg-config
      - name: allow user namespaces (hx-sandbox tests)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with: { shared-key: workspace }
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: tests (the host's bindings test is the staleness check for ui/src/host/bindings.ts)
        run: cargo test --workspace

  hx:
    # The hx binary the plugin's unit and end-to-end tests need, built once.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with: { shared-key: hx }
      - run: cargo build -p hx
      - uses: actions/upload-artifact@v4
        with:
          name: hx-debug
          path: target/debug/hx
          retention-days: 1
          if-no-files-found: error

  runtime:
    # The Hermes runtime the installer ships (ADR-0023), built by the same script and under the same cache key as
    # release.yml's runtime job, so the e2e tests below run on the artifact that ships. It is proven relocatable here too.
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - uses: actions/cache@v4
        id: runtime-cache
        with:
          path: dist/runtime
          key: hermes-runtime-linux-x86_64-ubuntu-22.04-${{ hashFiles('scripts/build-runtime.sh', 'scripts/verify-runtime.sh', 'scripts/runtime/**') }}
      - name: tools (zstd to compress, llvm-strip for the interpreter's debug symbols)
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y zstd llvm
      - name: build hermes-runtime-linux-x86_64.tar.zst and runtime.json (scripts/build-runtime.sh)
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        run: scripts/build-runtime.sh --out dist/runtime
      - name: relocation proof (unpacked in two paths, one with spaces)
        run: scripts/verify-runtime.sh dist/runtime
      - uses: actions/upload-artifact@v4
        with:
          name: hermes-runtime-linux-x86_64
          path: dist/runtime/*
          if-no-files-found: error
          retention-days: 7

  plugin:
    needs: hx
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      - uses: actions/download-artifact@v4
        with:
          name: hx-debug
          path: ${{ runner.temp }}/hx
      - run: chmod +x "${{ runner.temp }}/hx/hx"
      - name: allow user namespaces (hx-sandbox)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: ruff and pyright (pyproject.toml is tooling only)
        working-directory: plugins/hypotaxis
        run: |
          uvx ruff check . ../../tests/e2e
          uvx ruff format --check . ../../tests/e2e
          uvx --python ${{ matrix.python }} --with ruamel.yaml pyright
      - name: contraprova's CLI at the vendored commit (the ledger test verifies a ledger with it)
        env:
          CONTRAPROVA_TOKEN: ${{ secrets.CONTRAPROVA_TOKEN }}
        run: |
          sha=$(jq -r .sha plugins/hypotaxis/_vendor/contraprova/VENDOR.json)
          auth=""
          if [ -n "$CONTRAPROVA_TOKEN" ]; then
            echo "::add-mask::$CONTRAPROVA_TOKEN"
            auth="x-access-token:${CONTRAPROVA_TOKEN}@"
          fi
          echo "CONTRAPROVA_SPEC=contraprova @ git+https://${auth}github.com/aphesist/contraprova@${sha}" >> "$GITHUB_ENV"
      - name: unit tests (plain Python, no Hermes)
        working-directory: plugins/hypotaxis
        env:
          HX_BIN: ${{ runner.temp }}/hx/hx
        run: |
          uv run --no-project --python ${{ matrix.python }} --with pytest --with hypothesis --with ruamel.yaml --with "$CONTRAPROVA_SPEC" \
            pytest -q tests

  e2e:
    # The Hermes runtime the installer ships (the `runtime` job's artifact, unpacked) behind a fake model: one provider,
    # zero egress. CI tests what ships (ADR-0023); scripts/install-hermes-e2e.sh remains only for release.yml's smoke job.
    # BLOCKING is a decision for after the first green runs; until then a failure here shows red on the run but
    # must not stop a merge: continue-on-error keeps the workflow's overall result green. See docs/RELEASING.md.
    needs: [hx, runtime]
    runs-on: ubuntu-22.04
    continue-on-error: true
    timeout-minutes: 40
    env:
      HX_E2E_RUNTIME: /home/runner/hermes-runtime
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      - uses: actions/download-artifact@v4
        with:
          name: hx-debug
          path: ${{ runner.temp }}/hx
      - run: chmod +x "${{ runner.temp }}/hx/hx"
      - name: allow user namespaces (hx-sandbox)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - uses: actions/download-artifact@v4
        with:
          name: hermes-runtime-linux-x86_64
          path: ${{ runner.temp }}/runtime
      - name: unpack the runtime (the archive the installer carries)
        run: |
          mkdir -p "$HX_E2E_RUNTIME"
          zstd -d -q -c "$RUNNER_TEMP"/runtime/hermes-runtime-linux-x86_64.tar.zst | tar -x -C "$HX_E2E_RUNTIME"
      - name: contraprova's CLI at the vendored commit (the ledger test verifies a ledger with it)
        env:
          CONTRAPROVA_TOKEN: ${{ secrets.CONTRAPROVA_TOKEN }}
        run: |
          sha=$(jq -r .sha plugins/hypotaxis/_vendor/contraprova/VENDOR.json)
          auth=""
          if [ -n "$CONTRAPROVA_TOKEN" ]; then
            echo "::add-mask::$CONTRAPROVA_TOKEN"
            auth="x-access-token:${CONTRAPROVA_TOKEN}@"
          fi
          echo "CONTRAPROVA_SPEC=contraprova @ git+https://${auth}github.com/aphesist/contraprova@${sha}" >> "$GITHUB_ENV"
      - name: the plugin's end-to-end suite, and the sandbox tests that need Hermes's modules
        working-directory: plugins/hypotaxis
        env:
          HX_BIN: ${{ runner.temp }}/hx/hx
          HX_E2E_RUNTIME_ROOT: ${{ env.HX_E2E_RUNTIME }}  # the exec test also runs the bundled interpreter under runtime_ro
        run: |
          PYTHONPATH="$HX_E2E_RUNTIME/hermes-agent" \
          uv run --no-project --python 3.11 --with pytest --with hypothesis --with ruamel.yaml --with "$CONTRAPROVA_SPEC" \
            pytest -q ../../tests/e2e tests/test_exec_sandbox.py
      - name: WebKitGTK headers (the host's first-run test is a Rust test of its library)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev build-essential pkg-config
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
        with: { shared-key: e2e-host }
      - name: first-run setup on the real archive (the host unpacks it, then the whole flow against the fake model)
        env:
          HX_BIN: ${{ runner.temp }}/hx/hx
          HX_E2E_RUNTIME_ARCHIVE: ${{ runner.temp }}/runtime
        run: cargo test -p hypotaxis-host --test setup_live bundled -- --nocapture

  ui:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: apps/desktop/ui
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Chromium (cached by Playwright's version)
        id: pw-version
        run: echo "v=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw-version.outputs.v }}
      - run: pnpm exec playwright install --with-deps chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
      - run: pnpm exec playwright install-deps chromium
        if: steps.pw-cache.outputs.cache-hit == 'true'
      - run: pnpm test:smoke
