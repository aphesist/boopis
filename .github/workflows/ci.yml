name: ci
on:
  push:
    branches: [main, develop]
  pull_request:
permissions:
  contents: read
jobs:
  identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: every commit is the owner's alone
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then base=$(git rev-list --max-parents=0 HEAD | tail -1); fi
          sh scripts/check-commit-identity.sh "$base..HEAD"
  shared:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shared data files are copies of their sources (ADR-0016)
        run: scripts/sync-shared-data.sh --check
      - name: vendored contraprova is a byte-exact copy of its pinned commit (ADR-0015)
        run: scripts/vendor-contraprova.sh --check
      - name: generated hx types match the schema
        run: python3 scripts/gen-hx-types.py --check
  rust:
    runs-on: ubuntu-latest
    if: ${{ hashFiles('crates/*/Cargo.toml') != '' }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - run: cargo fmt --all --check
      # The desktop host needs the WebKitGTK system libraries: it has its own job below.
      - run: cargo clippy --workspace --exclude hypotaxis-host --all-targets -- -D warnings
      - run: cargo test --workspace --exclude hypotaxis-host
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: true }
      - name: Tauri's Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev build-essential pkg-config
      - run: rustup show
      - name: clippy (pedantic, -D warnings) and the host's tests; the bindings test is the staleness check for ui/src/host/bindings.ts
        run: |
          cargo clippy -p hypotaxis-host --all-targets -- -D warnings
          cargo test -p hypotaxis-host
      - name: the vendored Hermes contract is an exact copy of the pinned checkout
        if: ${{ hashFiles('vendor/hermes-agent/apps/shared/src/gateway-contract.generated.ts') != '' }}
        run: node apps/desktop/ui/scripts/vendor-hermes-shared.mjs vendor/hermes-agent --check
  plugin:
    runs-on: ubuntu-latest
    if: ${{ hashFiles('plugins/hypotaxis/pyproject.toml') != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: cargo build -p hx
      - name: ruff, pyright and the unit tests (pyproject.toml is tooling only)
        run: |
          cd plugins/hypotaxis
          uvx ruff check . && uvx ruff format --check .
          uvx --with ruamel.yaml pyright
          HX_BIN="$GITHUB_WORKSPACE/target/debug/hx" uv run --no-project --with pytest --with ruamel.yaml pytest -q tests
  ui:
    runs-on: ubuntu-latest
    if: ${{ hashFiles('apps/desktop/ui/package.json') != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: cd apps/desktop/ui && pnpm install --frozen-lockfile && pnpm typecheck && pnpm test
      - run: cd apps/desktop/ui && pnpm exec playwright install --with-deps chromium
      - run: cd apps/desktop/ui && pnpm test:smoke
