name: ci
# The gate (docs/STANDARDS.md section 10): pushes to develop and main, every pull request, and on demand. Work branches
# run the same gate locally before they merge; running it on every branch push spent the account's Actions minutes.
on:
  push:
    branches: [develop, main]
  pull_request:
  workflow_dispatch:
    inputs:
      dictation_all_os:
        description: "Also build and test dictation (whisper.cpp, the microphone crate, the recording through the real speech model) on Windows and macOS"
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # The v7 lab checks (docs/UI-LAB.md, "The v7 checks"): tests/lab/gate.mjs blocks on them for the v7 kit's own stories and source
  # ("kit") and reports them for today's v6 screens; "1" blocks everywhere, once wave C has moved the screens onto the kit.
  LAB_V7_BLOCKING: "kit"
  # The toolchain CI builds with (see docs/RELEASING.md). RUSTUP_TOOLCHAIN overrides rust-toolchain.toml's "stable".
  RUSTUP_TOOLCHAIN: "1.97.0"
  # ubuntu-22.04 on purpose: hx-sandbox needs unprivileged user namespaces, which 24.04 restricts with AppArmor.
  # The sysctl step below keeps these jobs working if the image moves to 24.04.

jobs:
  identity:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: every commit is the owner's alone, with no attribution lines
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            # a new branch or a rewritten one: check what it adds on top of develop (or main)
            base=$(git merge-base HEAD origin/develop 2>/dev/null || git merge-base HEAD origin/main 2>/dev/null || git rev-list --max-parents=0 HEAD | tail -1)
          fi
          echo "checking $base..HEAD"
          sh scripts/check-commit-identity.sh "$base..HEAD"

  installer-windows:
    # scripts/install.ps1 on real Windows, in Windows PowerShell 5.1 and PowerShell 7. Run from a pipe (irm ... | iex), a
    # failure must print why, leave the caller's session open with its settings as they were, and set LASTEXITCODE 1;
    # run as a file, it must exit 1. No release is reachable here (the API address is a closed port), so it fails on purpose.
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      BOOPIS_API_URL: http://127.0.0.1:9
    steps:
      - uses: actions/checkout@v4
      - name: from a pipe, Windows PowerShell 5.1
        shell: powershell
        run: |
          $before = $ErrorActionPreference
          $out = (Get-Content -Raw scripts/install.ps1 | Invoke-Expression) 2>&1 | Out-String
          if ($LASTEXITCODE -ne 1) { throw "expected LASTEXITCODE 1 after a failure, got $LASTEXITCODE" }
          if ($ErrorActionPreference -ne $before) { throw "the caller's ErrorActionPreference changed to $ErrorActionPreference" }
          Write-Output 'the session is still here after the failure'
          $global:LASTEXITCODE = 0
      - name: from a pipe, PowerShell 7
        shell: pwsh
        run: |
          $before = $ErrorActionPreference
          Get-Content -Raw scripts/install.ps1 | Invoke-Expression
          if ($LASTEXITCODE -ne 1) { throw "expected LASTEXITCODE 1 after a failure, got $LASTEXITCODE" }
          if ($ErrorActionPreference -ne $before) { throw "the caller's ErrorActionPreference changed to $ErrorActionPreference" }
          Write-Output 'the session is still here after the failure'
          $global:LASTEXITCODE = 0
      - name: as a file, a failure exits 1
        shell: pwsh
        run: |
          $p = Start-Process powershell -ArgumentList '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', 'scripts/install.ps1', '-Yes' -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 1) { throw "expected exit code 1, got $($p.ExitCode)" }
          $p = Start-Process pwsh -ArgumentList '-NoProfile', '-File', 'scripts/install.ps1', '-Yes' -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 1) { throw "expected exit code 1, got $($p.ExitCode)" }
          Write-Output 'both exit 1'
      - name: with only pre-releases, both shells pick the newest one alone
        # The repository has only pre-releases, so releases/latest is 404 and the installer falls back to the list. Windows
        # PowerShell 5.1 once read every tag of that list as one ("v0.1.7 v0.1.6 ..."). The fake API serves two; the
        # downloads are 404, so the installer stops there and names the release it chose.
        shell: pwsh
        env:
          BOOPIS_API_URL: http://127.0.0.1:8765
          BOOPIS_BASE_URL: http://127.0.0.1:8765
        run: |
          $server = Start-Process python -ArgumentList 'tests/installer/fake_release_api.py', '8765' -PassThru -NoNewWindow
          try {
            $deadline = (Get-Date).AddSeconds(30)
            while ($true) {
              try { Invoke-RestMethod http://127.0.0.1:8765/repos/x/y/releases | Out-Null; break }
              catch { if ((Get-Date) -gt $deadline) { throw 'the fake API did not start' }; Start-Sleep -Milliseconds 200 }
            }
            foreach ($shell in 'powershell', 'pwsh') {
              $log = Join-Path $env:RUNNER_TEMP "$shell-prerelease.txt"
              $argv = @('-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', 'scripts/install.ps1', '-Yes')
              Start-Process $shell -ArgumentList $argv -Wait -NoNewWindow -RedirectStandardOutput $log -RedirectStandardError "$log.err" | Out-Null
              $out = "$(Get-Content -Raw $log) $(Get-Content -Raw "$log.err")" -replace '\s+', ' '
              Write-Output "---- $shell"; Write-Output $out
              if ($out -notmatch 'from release v0\.9\.2\.') { throw "$shell did not name v0.9.2 alone as the release" }
              if ($out -match 'v0\.9\.1') { throw "$shell named the older release too" }
            }
          }
          finally { Stop-Process -Id $server.Id -Force -ErrorAction SilentlyContinue }

  installer:
    # The installers and the art they carry (ADR-0026): shellcheck, the brand goldens (with the embedded blocks current),
    # and an install and uninstall into a temp prefix. No Rust and no cache: it is shell and awk only.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck and util-linux's script
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends shellcheck util-linux
      - name: shellcheck
        run: shellcheck scripts/install.sh scripts/embed-brand.sh scripts/test-brand.sh scripts/test-install.sh
      - name: the art renders the same bytes as the goldens, and the embedded blocks are current
        run: scripts/test-brand.sh
      - name: install and uninstall
        run: scripts/test-install.sh

  checks:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: shared data files are copies of their sources (ADR-0016)
        run: scripts/sync-shared-data.sh --check
      - name: generated hx types match the schema
        run: python3 scripts/gen-hx-types.py --check
      - name: vendored contraprova is a byte-exact copy of its pinned commit (ADR-0015)
        # The source repository may be private: add the repository secret CONTRAPROVA_TOKEN (a fine-grained,
        # read-only token for aphesist/contraprova). Without it the default public URL is tried.
        env:
          CONTRAPROVA_TOKEN: ${{ secrets.CONTRAPROVA_TOKEN }}
        run: |
          if [ -n "$CONTRAPROVA_TOKEN" ]; then
            echo "::add-mask::$CONTRAPROVA_TOKEN"
            export CONTRAPROVA_REPO="https://x-access-token:${CONTRAPROVA_TOKEN}@github.com/aphesist/contraprova.git"
          fi
          scripts/vendor-contraprova.sh --check
      - name: vendored orb-avatar is a byte-exact copy of its pinned orb3 commit (ADR-0051)
        run: scripts/vendor-orb.sh --check

  rust:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Tauri's Linux prerequisites (the host is part of the workspace)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev build-essential pkg-config libasound2-dev cmake clang
      - name: allow user namespaces (hx-sandbox tests)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with: { shared-key: workspace }
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: tests (the host's bindings test is the staleness check for ui/src/host/bindings.ts)
        run: cargo test --workspace
      - name: when a test failed, what the registry generates (the bindings and the permission files, against what is checked in)
        if: failure()
        run: |
          HX_UPDATE_BINDINGS=1 cargo test -p boopis-host --lib bindings_are_fresh || true
          git status --short -- apps/desktop/ui/src/host/bindings.ts apps/desktop/src-tauri/permissions
          git diff -- apps/desktop/ui/src/host/bindings.ts apps/desktop/src-tauri/permissions | head -400

  dictation:
    # Dictation hears (ADR-0052): crates/boopis-dictation's tests, and tests/speech.rs with the REAL speech model, which plays
    # a public-domain recording (tests/fixtures/jfk.wav) to a real dictation, as a 16 kHz and as a 48 kHz microphone and
    # once at the speed it was spoken, and checks the words whisper.cpp wrote. This is the job that proves the microphone
    # button transcribes; HX_DICTATION_REQUIRE_MODEL makes a skipped model a failure. The model (57 MB) is fetched from the
    # address the app itself uses, kept in the workflow's cache, and checked against the SHA-256 the app pins on every
    # run, cached or not. The timings it prints (`TIMING ...`) are this runner's.
    # Linux on every run. Windows and macOS (WASAPI and Core Audio, MSVC and Apple clang building whisper.cpp) only when
    # dispatched with `dictation_all_os`: macOS minutes count ten times. No runner has a microphone: the capture test
    # checks that the device opens or says why not, never that it hears.
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.dictation_all_os && '["ubuntu-22.04", "windows-latest", "macos-latest"]' || '["ubuntu-22.04"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: ALSA's headers, CMake and clang (whisper.cpp is built from source)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev cmake clang
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with: { shared-key: "dictation-${{ matrix.os }}" }
      - uses: actions/cache@v4
        with:
          path: dist/speech-model
          key: speech-model-${{ hashFiles('crates/boopis-dictation/src/model.rs') }}
          enableCrossOsArchive: true
      - name: the speech model, from the address and with the hash the app pins (crates/boopis-dictation/src/model.rs)
        run: |
          table=crates/boopis-dictation/src/model.rs
          url=$(sed -n 's/^ *url: "\(.*\)",$/\1/p' "$table" | head -1)
          sha=$(sed -n 's/^ *sha256: "\(.*\)",$/\1/p' "$table" | head -1)
          file=$(sed -n 's/^ *file: "\(.*\)",$/\1/p' "$table" | head -1)
          [ -n "$url" ] && [ -n "$sha" ] && [ -n "$file" ] || { echo "could not read the model table"; exit 1; }
          mkdir -p dist/speech-model
          if [ ! -f "dist/speech-model/$file" ]; then
            curl --fail --location --silent --show-error --retry 3 --output "dist/speech-model/$file" "$url"
          fi
          if command -v sha256sum >/dev/null; then found=$(sha256sum "dist/speech-model/$file"); else found=$(shasum -a 256 "dist/speech-model/$file"); fi
          found=${found%% *}
          echo "$file: $found (pinned $sha)"
          [ "$found" = "$sha" ] || { rm -f "dist/speech-model/$file"; echo "the model is not the pinned file; it was deleted"; exit 1; }
          # the workspace as the system writes it: on Windows the test is not a bash program and reads no /d/a/... path
          echo "HX_DICTATION_MODEL=${GITHUB_WORKSPACE}/dist/speech-model/$file" >> "$GITHUB_ENV"
      - run: cargo clippy -p boopis-dictation --all-targets -- -D warnings
      - name: the crate's tests, and the recording through the real model (a skip is a failure here)
        env:
          HX_DICTATION_REQUIRE_MODEL: "1"
        run: cargo test -p boopis-dictation -- --nocapture --test-threads=1

  hx:
    # The hx binary the plugin's unit and end-to-end tests need, built once.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with: { shared-key: hx }
      - run: cargo build -p hx
      - uses: actions/upload-artifact@v4
        with:
          name: hx-debug
          path: target/debug/hx
          retention-days: 1
          if-no-files-found: error

  runtime:
    # The Hermes runtime the installer ships (ADR-0023), built by the same script and under the same cache key as
    # release.yml's runtime job, so the e2e tests below run on the artifact that ships. It is proven relocatable here too.
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - uses: actions/cache@v4
        id: runtime-cache
        with:
          path: dist/runtime
          key: hermes-runtime-linux-x86_64-ubuntu-22.04-${{ hashFiles('scripts/build-runtime.sh', 'scripts/verify-runtime.sh', 'scripts/runtime/**') }}
      - name: tools (zstd to compress, llvm-strip for the interpreter's debug symbols)
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y zstd llvm
      - name: build hermes-runtime-linux-x86_64.tar.zst and runtime.json (scripts/build-runtime.sh)
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        run: scripts/build-runtime.sh --out dist/runtime
      - name: relocation proof (unpacked in two paths, one with spaces)
        run: scripts/verify-runtime.sh dist/runtime
      - uses: actions/upload-artifact@v4
        with:
          name: hermes-runtime-linux-x86_64
          path: dist/runtime/*
          if-no-files-found: error
          retention-days: 7

  plugin:
    needs: hx
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      - uses: actions/download-artifact@v4
        with:
          name: hx-debug
          path: ${{ runner.temp }}/hx
      - run: chmod +x "${{ runner.temp }}/hx/hx"
      - name: allow user namespaces (hx-sandbox)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: ruff and pyright (pyproject.toml is tooling only)
        working-directory: plugins/boopis
        run: |
          uvx ruff check . ../../tests/e2e
          uvx ruff format --check . ../../tests/e2e
          uvx --python ${{ matrix.python }} --with ruamel.yaml pyright
      - name: contraprova's CLI at the vendored commit (the ledger test verifies a ledger with it)
        env:
          CONTRAPROVA_TOKEN: ${{ secrets.CONTRAPROVA_TOKEN }}
        run: |
          sha=$(jq -r .sha plugins/boopis/_vendor/contraprova/VENDOR.json)
          auth=""
          if [ -n "$CONTRAPROVA_TOKEN" ]; then
            echo "::add-mask::$CONTRAPROVA_TOKEN"
            auth="x-access-token:${CONTRAPROVA_TOKEN}@"
          fi
          echo "CONTRAPROVA_SPEC=contraprova @ git+https://${auth}github.com/aphesist/contraprova@${sha}" >> "$GITHUB_ENV"
      - name: unit tests (plain Python, no Hermes)
        working-directory: plugins/boopis
        env:
          HX_BIN: ${{ runner.temp }}/hx/hx
        run: |
          uv run --no-project --python ${{ matrix.python }} --with pytest --with hypothesis --with ruamel.yaml --with "$CONTRAPROVA_SPEC" \
            pytest -q tests

  e2e:
    # The Hermes runtime the installer ships (the `runtime` job's artifact, unpacked) behind a fake model: one provider,
    # zero egress. CI tests what ships (ADR-0023); scripts/install-hermes-e2e.sh remains only for release.yml's smoke job.
    # BLOCKING is a decision for after the first green runs; until then a failure here shows red on the run but
    # must not stop a merge: continue-on-error keeps the workflow's overall result green. See docs/RELEASING.md.
    needs: [hx, runtime]
    runs-on: ubuntu-22.04
    continue-on-error: true
    timeout-minutes: 40
    env:
      HX_E2E_RUNTIME: /home/runner/hermes-runtime
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { enable-cache: true }
      - uses: actions/download-artifact@v4
        with:
          name: hx-debug
          path: ${{ runner.temp }}/hx
      - run: chmod +x "${{ runner.temp }}/hx/hx"
      - name: allow user namespaces (hx-sandbox)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - uses: actions/download-artifact@v4
        with:
          name: hermes-runtime-linux-x86_64
          path: ${{ runner.temp }}/runtime
      - name: unpack the runtime (the archive the installer carries)
        run: |
          mkdir -p "$HX_E2E_RUNTIME"
          zstd -d -q -c "$RUNNER_TEMP"/runtime/hermes-runtime-linux-x86_64.tar.zst | tar -x -C "$HX_E2E_RUNTIME"
      - name: contraprova's CLI at the vendored commit (the ledger test verifies a ledger with it)
        env:
          CONTRAPROVA_TOKEN: ${{ secrets.CONTRAPROVA_TOKEN }}
        run: |
          sha=$(jq -r .sha plugins/boopis/_vendor/contraprova/VENDOR.json)
          auth=""
          if [ -n "$CONTRAPROVA_TOKEN" ]; then
            echo "::add-mask::$CONTRAPROVA_TOKEN"
            auth="x-access-token:${CONTRAPROVA_TOKEN}@"
          fi
          echo "CONTRAPROVA_SPEC=contraprova @ git+https://${auth}github.com/aphesist/contraprova@${sha}" >> "$GITHUB_ENV"
      - name: the plugin's end-to-end suite, and the sandbox tests that need Hermes's modules
        working-directory: plugins/boopis
        env:
          HX_BIN: ${{ runner.temp }}/hx/hx
          HX_E2E_RUNTIME_ROOT: ${{ env.HX_E2E_RUNTIME }}  # the exec test also runs the bundled interpreter under runtime_ro
        run: |
          PYTHONPATH="$HX_E2E_RUNTIME/hermes-agent" \
          uv run --no-project --python 3.11 --with pytest --with hypothesis --with ruamel.yaml --with "$CONTRAPROVA_SPEC" \
            pytest -q ../../tests/e2e tests/test_exec_sandbox.py
      - name: WebKitGTK headers (the host's first-run test is a Rust test of its library)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev build-essential pkg-config libasound2-dev cmake clang
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
        with: { shared-key: e2e-host }
      - name: first-run setup on the real archive (the host unpacks it, then the whole flow against the fake model)
        env:
          HX_BIN: ${{ runner.temp }}/hx/hx
          HX_E2E_RUNTIME_ARCHIVE: ${{ runner.temp }}/runtime
        run: cargo test -p boopis-host --test setup_live bundled -- --nocapture

  appimage:
    # The Linux AppImage, built by the same composite action as release.yml's `linux` job (ADR-0023's runtime inside it), so
    # `desktop-smoke` tests what a release would ship. Non-blocking like it: see the note there. Kept one day.
    needs: runtime
    runs-on: ubuntu-22.04
    continue-on-error: true
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: hermes-runtime-linux-x86_64
          path: ${{ runner.temp }}/runtime
      - uses: ./.github/actions/build-appimage
        with:
          runtime-dir: ${{ runner.temp }}/runtime
      - uses: actions/upload-artifact@v4
        with:
          name: ci-appimage  # not boopis-*: nothing here is published
          path: dist/*.AppImage
          if-no-files-found: error
          retention-days: 1

  desktop-smoke:
    # release.yml's `smoke` job, on every change: the AppImage above driven headless (Xvfb, WebKitWebDriver) through
    # tests/e2e/smoke_desktop.py against real Hermes and the fake model, with the same composite action (.github/actions/desktop-smoke),
    # so a broken smoke shows here, on a branch, before anyone starts a release (0.1.7 found one only after every installer had built).
    # NON-BLOCKING for now, like `e2e` and for the same reason: it has not yet run here (a cold Hermes install and a full AppImage
    # build). continue-on-error keeps the workflow's result green when it fails; the failure still shows red on the run. Remove
    # `continue-on-error: true` from this job and from `appimage` once it has been green for a few runs. release.yml's own smoke stays required.
    needs: appimage
    if: ${{ needs.appimage.result == 'success' }}
    runs-on: ubuntu-22.04
    continue-on-error: true
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ci-appimage
          path: ${{ runner.temp }}/app
      - uses: ./.github/actions/desktop-smoke
        with:
          app-dir: ${{ runner.temp }}/app
          screenshot-artifact: desktop-smoke-screenshot

  desktop-window:
    # The built app's own window on a fresh profile, on windows-latest and ubuntu-22.04 (.github/workflows/desktop-window.yml,
    # also dispatchable alone): first run shows the window's controls for the desktop, and on Windows the undecorated window
    # resizes from its edges, keeps Snap's styles, maximises, minimises and closes. NON-BLOCKING for now: its job carries
    # continue-on-error (a job that calls a workflow cannot), so this result stays green when it fails.
    uses: ./.github/workflows/desktop-window.yml

  ui:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: apps/desktop/ui
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # Chromium comes before the unit tests: src/lab/overlap.test.ts runs the lab's probe in a real browser.
      - name: Chromium (cached by Playwright's version)
        id: pw-version
        run: echo "v=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw-version.outputs.v }}
      - run: pnpm exec playwright install --with-deps chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
      - run: pnpm exec playwright install-deps chromium
        if: steps.pw-cache.outputs.cache-hit == 'true'
      - run: pnpm test
      - run: pnpm test:smoke
      # The engine Tauri uses on Linux is WebKitGTK, and Chromium does not show what it gets wrong: the dock's content vanished
      # in it while the slab moved. This drives the e2e build the smoke just made in a real WebKitGTK (WebKitWebDriver under
      # Xvfb) and fails when a snapshot of the moving dock has no content in it. Required, like every step of this job.
      - uses: astral-sh/setup-uv@v5
      - name: WebKitGTK, WebKitWebDriver and Xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb webkit2gtk-driver libwebkit2gtk-4.1-0
      - name: the dock keeps its content in WebKitGTK (hover, leave, a session, a bot, the first bot and the first session)
        run: uv run --no-project --python 3.11 --with pillow python ../../../tests/e2e/dock_webkit.py --dist dist-e2e

  lab:
    # The UI lab (docs/UI-LAB.md): every story's every state through the geometry, concentric-corner, overlay, token,
    # native-control, scrollbar, brand, axe, stability and screenshot checks, in every preset and width. BLOCKING for
    # every check but `visual`: a full run reported 0 failures in all 720 states on 20 November 2026. The screenshot
    # comparison stays a report (counted, uploaded, never failing the job): its goldens are taken in the lab's Chromium on
    # a developer machine, and the runner's font rasteriser differs, so a pixel diff here is not a defect by itself.
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    defaults:
      run:
        working-directory: apps/desktop/ui
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Chromium (cached by Playwright's version)
        id: pw-version
        run: echo "v=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw-version.outputs.v }}
      - run: pnpm exec playwright install --with-deps chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
      - run: pnpm exec playwright install-deps chromium
        if: steps.pw-cache.outputs.cache-hit == 'true'
      # the whole matrix: about 40 minutes at two at a time. The run itself always finishes; the next step decides
      - run: pnpm lab:check --jobs 2
      # every check but the screenshot comparison blocks; the v7 checks block on the v7 kit (LAB_V7_BLOCKING=kit) and are reported for the v6 screens (docs/UI-LAB.md)
      - name: every check but the screenshot comparison passes (v7 checks block on the kit, report on the v6 screens)
        run: node tests/lab/gate.mjs lab-report/summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lab-report
          path: apps/desktop/ui/lab-report/
          retention-days: 14
      # chips in running text at the owner's fractional and a 2x scale: the inline-baseline check's tolerances are device pixels
      - run: pnpm lab:check --story components/inline-chips --dpr 2 --no-visual --no-axe --no-stability && node tests/lab/gate.mjs lab-report/summary.json
      - run: pnpm lab:check --story components/inline-chips --dpr 1.6 --no-visual --no-axe --no-stability && node tests/lab/gate.mjs lab-report/summary.json

  lab-orbs:
    # The v7 orb checks (docs/UI-LAB.md, "The orb checks"; ORBS.md G5 to G7): every story state that draws an orb, read from the orbs'
    # own canvas pixels frame by frame on a paused clock. orb.rest: a bot at rest changes 0 pixels; orb.edges: no shimmer, no lone
    # flipping pixel, no canvas that jumps or refits. Blocking on the kit's stories and reported on the v6 screens, like every v7 check;
    # the orbs are orb3 3.0.2 (ADR-0051).
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    defaults:
      run:
        working-directory: apps/desktop/ui
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Chromium (cached by Playwright's version)
        id: pw-version
        run: echo "v=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw-version.outputs.v }}
      - run: pnpm exec playwright install --with-deps chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
      - run: pnpm exec playwright install-deps chromium
        if: steps.pw-cache.outputs.cache-hit == 'true'
      - run: pnpm lab:orbs --jobs 2
      - name: the orb checks (blocking on the kit's stories, reported on the v6 screens)
        run: node tests/lab/gate.mjs lab-report-orbs/summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lab-orbs-report
          path: apps/desktop/ui/lab-report-orbs/
          retention-days: 14
