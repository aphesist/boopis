name: release
# Builds the desktop app in release mode on every push to develop and on tags v*. The Linux AppImage is the
# deliverable (the owner runs Arch); Windows and macOS bundles are non-blocking extras. Builds are unsigned, except the macOS
# one when the repository has the Apple secrets (Developer ID and notarisation, docs/RELEASING.md "macOS").
# On a tag, the AppImage, the Arch package and SHA256SUMS become a GitHub release. A release can also be cut from the
# Actions tab without a clone: run this workflow with `release` set to the version's tag (vX.Y.Z, equal to the app's
# version); the release job then creates that tag on the commit it built and publishes. With `from_run` set, nothing is
# built: the smoke jobs run (with this commit's scripts) against the artifacts of an earlier run of this workflow, and
# `release` publishes exactly those. How to use it: docs/RELEASING.md.
on:
  push:
    branches: [develop]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a release with this tag (vX.Y.Z, equal to the app's version). Empty: build only."
        required: false
        default: ""
      from_run:
        description: "Publish from an earlier run: the id of a release.yml run of this repository on the same version. Skips every build, downloads that run's installers, smoke-tests them with this commit's scripts, and publishes them if `release` is set."
        required: false
        default: ""
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true
env:
  # The release this run publishes: the pushed tag, or the tag asked for on a manual run; empty otherwise.
  RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release || '' }}
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # The toolchain CI builds with (see docs/RELEASING.md). RUSTUP_TOOLCHAIN overrides rust-toolchain.toml's "stable".
  RUSTUP_TOOLCHAIN: "1.97.0"
  # Updater signing slot (documented in docs/RELEASING.md). Create the repository secrets
  # TAURI_SIGNING_PRIVATE_KEY (and TAURI_SIGNING_PRIVATE_KEY_PASSWORD) when the updater is turned on; the keys
  # never live in the repository. Unset, they are empty strings and Tauri ignores them while
  # `bundle.createUpdaterArtifacts` is off (it is off today).
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
  # The Arch package's artifact (ADR-0025). Named boopis-* because the release job publishes that pattern; a change of
  # name changes this line and the pattern in `release` together.
  ARCH_ARTIFACT: boopis-arch-x86_64-pkg

jobs:
  reuse:
    # Only with `from_run`: checks that the earlier run's artifacts may be published from this commit. They must come from a
    # release.yml run of this repository, be the version this commit's app has, and have been built from a commit that differs
    # from this one only in files the smoke jobs read or that nothing ships (tests, workflows, docs). Anything else is refused:
    # a change to shipped code needs a new build. It replaces every build job, which `if: inputs.from_run == ''` skips.
    if: ${{ inputs.from_run != '' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.guard.outputs.sha }}
      version: ${{ steps.guard.outputs.version }}
      has_arch: ${{ steps.guard.outputs.has_arch }}
      has_macos: ${{ steps.guard.outputs.has_macos }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: the run's artifacts may be published from this commit
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          FROM_RUN: ${{ inputs.from_run }}
        run: |
          refuse() { echo "::error title=Refusing to publish from run $FROM_RUN::$*"; exit 1; }
          [[ "$FROM_RUN" =~ ^[0-9]+$ ]] || refuse "from_run must be a run id (digits only), not '$FROM_RUN'."
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$FROM_RUN") || refuse "there is no run $FROM_RUN in $GITHUB_REPOSITORY."
          path=$(jq -r .path <<<"$run"); repo=$(jq -r .repository.full_name <<<"$run"); head_repo=$(jq -r '.head_repository.full_name // ""' <<<"$run")
          status=$(jq -r .status <<<"$run"); sha=$(jq -r .head_sha <<<"$run")
          case "$path" in
            .github/workflows/release.yml|.github/workflows/release.yml@*) ;;
            *) refuse "run $FROM_RUN is a run of $path, not of .github/workflows/release.yml." ;;
          esac
          [ "$repo" = "$GITHUB_REPOSITORY" ] && [ "$head_repo" = "$GITHUB_REPOSITORY" ] || refuse "run $FROM_RUN is not a run of $GITHUB_REPOSITORY itself ($repo, head from $head_repo)."
          [ "$status" = completed ] || refuse "run $FROM_RUN is $status; wait for it to finish."
          echo "run $FROM_RUN: release.yml at $sha"

          # the artifacts must still be kept
          names=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$FROM_RUN/artifacts" --jq '.artifacts[] | select(.expired | not) | .name')
          grep -qx boopis-linux-x86_64-appimage <<<"$names" || refuse "run $FROM_RUN has no kept AppImage artifact (boopis-linux-x86_64-appimage): its build failed or the artifacts expired."
          has_arch=false; grep -qx "$ARCH_ARTIFACT" <<<"$names" && has_arch=true
          has_macos=false; grep -qx boopis-macos-aarch64-dmg <<<"$names" && has_macos=true
          echo "kept artifacts: $(tr '\n' ' ' <<<"$names")"

          # the version: the artifacts' commit and this commit must name the same app version
          git cat-file -e "$sha^{commit}" 2>/dev/null || git fetch --quiet origin "$sha" || refuse "commit $sha of run $FROM_RUN is not fetchable."
          then_v=$(git show "$sha:apps/desktop/src-tauri/tauri.conf.json" | jq -r .version)
          now_v=$(jq -r .version apps/desktop/src-tauri/tauri.conf.json)
          [ "$then_v" = "$now_v" ] || refuse "run $FROM_RUN built version $then_v, but this commit's app is $now_v."
          if [ -n "$RELEASE_TAG" ]; then
            [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || refuse "release tag $RELEASE_TAG is not vX.Y.Z."
            [ "$RELEASE_TAG" = "v$now_v" ] || refuse "release tag $RELEASE_TAG, but the app is $now_v."
          fi

          # the commits may differ only in files that do not ship (tests, workflows, docs) and the two helper scripts the smoke jobs read
          bad=$(git diff --no-renames --name-only "$sha" "$GITHUB_SHA" | grep -Ev '^(tests/|docs/|\.github/|packaging/arch/smoke\.sh$|scripts/install-hermes-e2e\.sh$)|/tests/' || true)
          if [ -n "$bad" ]; then
            echo "$bad" | awk '{print "  changed: " $0}'
            refuse "this commit ($GITHUB_SHA) differs from the artifacts' commit ($sha) in files that ship, listed above. Only tests/, docs/, .github/ and the smoke helper scripts may differ; build again instead."
          fi
          echo "ok: version $now_v, and the commits differ only in files that do not ship"
          {
            echo "sha=$sha"
            echo "version=$now_v"
            echo "has_arch=$has_arch"
            echo "has_macos=$has_macos"
          } >> "$GITHUB_OUTPUT"
          echo "Publishing from run $FROM_RUN (built at ${sha:0:8}, smoke scripts from ${GITHUB_SHA:0:8}), version $now_v." >> "$GITHUB_STEP_SUMMARY"

  runtime:
    if: ${{ inputs.from_run == '' }}
    # The Hermes runtime the installer carries (ADR-0023): python-build-standalone, uv and Hermes v0.23.2 with its locked,
    # hash-checked dependencies, built by Hermes's own build code. Proven relocatable before anything uses it. The same
    # script and cache key as ci.yml's runtime job, so the e2e tests run on the bytes that ship.
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - uses: actions/cache@v4
        id: runtime-cache
        with:
          path: dist/runtime
          key: hermes-runtime-linux-x86_64-ubuntu-22.04-${{ hashFiles('scripts/build-runtime.sh', 'scripts/verify-runtime.sh', 'scripts/runtime/**') }}
      - name: tools (zstd to compress, llvm-strip for the interpreter's debug symbols)
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y zstd llvm
      - name: build hermes-runtime-linux-x86_64.tar.zst and runtime.json (scripts/build-runtime.sh)
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        run: scripts/build-runtime.sh --out dist/runtime
      - name: relocation proof (unpacked in two paths, one with spaces)
        run: |
          scripts/verify-runtime.sh dist/runtime
      - name: sizes
        run: |
          ls -l dist/runtime
          jq -r '"runtime archive: \(.archive.size) bytes, unpacked about \(.unpacked_size) bytes, Hermes \(.hermes_version), Python \(.python_version)"' dist/runtime/runtime.json | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          # not named boopis-*: the release job publishes only those
          name: hermes-runtime-linux-x86_64
          path: dist/runtime/*
          if-no-files-found: error
          retention-days: 30

  linux:
    if: ${{ inputs.from_run == '' }}
    needs: runtime
    # ubuntu-22.04: the oldest glibc and WebKitGTK 4.1 the app needs, so the AppImage runs on every newer distro.
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: the tag matches the app's version
        if: env.RELEASE_TAG != ''
        run: |
          v=$(jq -r .version apps/desktop/src-tauri/tauri.conf.json)
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "release tag $RELEASE_TAG is not vX.Y.Z"; exit 1; }
          [ "$RELEASE_TAG" = "v$v" ] || { echo "tag $RELEASE_TAG but tauri.conf.json says $v"; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          name: hermes-runtime-linux-x86_64
          path: ${{ runner.temp }}/runtime
      - name: build the AppImage (the steps ci.yml's desktop-smoke job builds with too)
        uses: ./.github/actions/build-appimage
        with:
          runtime-dir: ${{ runner.temp }}/runtime
      - uses: actions/upload-artifact@v4
        with:
          name: boopis-linux-x86_64-appimage
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  arch:
    # The native Arch package (ADR-0025): built with makepkg in an Arch container, so it links the system's WebKitGTK
    # (2.54.x, not the AppImage's Ubuntu 22.04 one). It needs only the runtime archive, which the AppImage needs too, and
    # nothing needs it: a failure here does not stop the AppImage or the release. docs/RELEASING.md, "The Arch package".
    if: ${{ inputs.from_run == '' }}
    needs: runtime
    runs-on: ubuntu-22.04
    container: archlinux:latest
    timeout-minutes: 75
    env:
      BOOPIS_TARGET_DIR: /home/builder/target   # cargo's output, cached between runs
    steps:
      - name: build tools (makepkg needs git, a compiler and the package's own makedepends and depends)
        run: |
          pacman -Syu --noconfirm --needed base-devel git zstd
          useradd -m builder
      - uses: actions/checkout@v4
      - name: the makedepends and depends of the PKGBUILD, read from the file itself
        run: |
          bash -c 'source packaging/arch/PKGBUILD; pacman -S --noconfirm --needed "${makedepends[@]}" "${depends[@]}" namcap'
          # corepack comes from makedepends and runs the pnpm that apps/desktop/ui/package.json pins (packageManager):
          # Arch has no `pnpm` on PATH here; the PKGBUILD's build() makes a corepack shim for it. Run from the UI so the pin applies.
          rustc -V && node -v && corepack -v && (cd apps/desktop/ui && corepack pnpm -v)
      - name: the tag and the PKGBUILD match the app's version
        run: |
          v=$(sed -n 's/^ *"version": *"\(.*\)",/\1/p' apps/desktop/src-tauri/tauri.conf.json | head -1)
          p=$(bash -c 'source packaging/arch/PKGBUILD; echo "$pkgver"')
          echo "tauri.conf.json $v, PKGBUILD $p"
          [ "$v" = "$p" ] || { echo "PKGBUILD pkgver $p but tauri.conf.json says $v"; exit 1; }
          if [ -n "$RELEASE_TAG" ]; then [ "$RELEASE_TAG" = "v$v" ] || { echo "tag $RELEASE_TAG but the app is $v"; exit 1; }; fi
      - uses: actions/download-artifact@v4
        with:
          name: hermes-runtime-linux-x86_64
          path: packaging/arch
      - name: the cargo registry and the build output
        uses: actions/cache@v4
        with:
          path: |
            /home/builder/.cargo/registry
            /home/builder/.cargo/git
            /home/builder/target
          key: arch-pkg-${{ hashFiles('Cargo.lock') }}
          restore-keys: arch-pkg-
      - name: makepkg (prepare fetches cargo and, through corepack, the pinned pnpm; build is offline)
        run: |
          mkdir -p /home/builder/target /home/builder/.cargo
          chown -R builder: . /home/builder/target /home/builder/.cargo
          su builder -c 'cd packaging/arch && makepkg --noconfirm'
      - name: namcap, informational, its findings go to the summary
        run: |
          {
            echo '### namcap'
            echo '```'
            namcap packaging/arch/PKGBUILD || true
            for p in packaging/arch/*.pkg.tar.zst; do namcap "$p" || true; done
            echo '```'
            echo "package: $(stat -c '%n %s bytes' packaging/arch/*.pkg.tar.zst)"
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCH_ARTIFACT }}
          path: packaging/arch/*.pkg.tar.zst
          if-no-files-found: error
          retention-days: 30

  arch-smoke:
    # The built package in a clean Arch container: pacman -U pulls the dependencies from the repositories, then
    # packaging/arch/smoke.sh checks the links (the system's libwebkit2gtk-4.1 from /usr/lib), the runtime archive and --version.
    # With `from_run` it tests the package of that run, with this commit's smoke.sh.
    if: ${{ !cancelled() && (needs.arch.result == 'success' || (needs.reuse.result == 'success' && needs.reuse.outputs.has_arch == 'true')) }}
    needs: [arch, reuse]
    runs-on: ubuntu-22.04
    container: archlinux:latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - name: a current system (no partial upgrades), git for the checkout
        run: pacman -Syu --noconfirm --needed git desktop-file-utils
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARCH_ARTIFACT }}
          path: pkg
          run-id: ${{ inputs.from_run || github.run_id }}
          github-token: ${{ github.token }}
      - name: the package is this commit's version
        run: |
          v=$(sed -n 's/^ *"version": *"\(.*\)",/\1/p' apps/desktop/src-tauri/tauri.conf.json | head -1)
          ls pkg
          ls pkg/boopis-"$v"-*.pkg.tar.zst >/dev/null || { echo "no package for version $v in pkg/"; exit 1; }
      - name: pacman -U
        run: pacman -U --noconfirm pkg/*.pkg.tar.zst
      - name: smoke
        run: packaging/arch/smoke.sh "$GITHUB_WORKSPACE"
      - name: the desktop entry is valid
        run: desktop-file-validate /usr/share/applications/boopis.desktop

  smoke:
    # The built AppImage, headless (Xvfb + WebKitWebDriver), against real Hermes v0.23.2 and the fake model:
    # the UI loads, the host connects, a prompt streams a reply. Required: a failure fails the run and stops a tag's release.
    # The steps are the composite action ci.yml's desktop-smoke job runs too. With `from_run` the AppImage is the earlier
    # run's and the scripts are this commit's.
    if: ${{ !cancelled() && (needs.linux.result == 'success' || needs.reuse.result == 'success') }}
    needs: [linux, reuse]
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: boopis-linux-x86_64-appimage
          path: ${{ runner.temp }}/app
          run-id: ${{ inputs.from_run || github.run_id }}
          github-token: ${{ github.token }}
      - name: the AppImage is this commit's version
        run: |
          v=$(jq -r .version apps/desktop/src-tauri/tauri.conf.json)
          ls "$RUNNER_TEMP"/app
          ls "$RUNNER_TEMP"/app/boopis_"$v"_amd64.AppImage >/dev/null || { echo "no boopis_${v}_amd64.AppImage: the artifact is another version than this commit's app"; exit 1; }
      - uses: ./.github/actions/desktop-smoke
        with:
          app-dir: ${{ runner.temp }}/app
          screenshot-artifact: smoke-screenshot

  runtime-windows:
    if: ${{ inputs.from_run == '' }}
    # The Hermes runtime for Windows x64 (ADR-0023), cross-built on Linux: Hermes's own build code stages python-build-standalone
    # and uv for win32-x64, `uv pip install --python-platform x86_64-pc-windows-msvc` installs the locked wheels (hashes checked,
    # no source builds) and the launchers are minted with distlib's Windows stub. Nothing of the target runs here, so the checks
    # are the archive's own (hash, PE headers, the files the host looks for); the first run on Windows is the proof.
    # scripts/build-runtime.sh and docs/RELEASING.md, "Windows".
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - uses: astral-sh/setup-uv@v5
      - uses: actions/cache@v4
        id: runtime-cache
        with:
          path: dist/runtime-windows
          key: hermes-runtime-windows-x86_64-ubuntu-22.04-${{ hashFiles('scripts/build-runtime.sh', 'scripts/runtime/**') }}
      - name: tools (zstd to compress)
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y zstd
      - name: build hermes-runtime-windows-x86_64.tar.zst and runtime.json (scripts/build-runtime.sh --target windows-x86_64)
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        run: scripts/build-runtime.sh --target windows-x86_64 --out dist/runtime-windows
      - name: the archive is what runtime.json says, and holds the Windows launcher and interpreter
        run: |
          cd dist/runtime-windows
          want=$(jq -r .archive.sha256 runtime.json); got=$(sha256sum -- *.tar.zst | cut -d' ' -f1)
          [ "$want" = "$got" ] || { echo "hash $got, runtime.json says $want"; exit 1; }
          hermes=$(jq -r .hermes runtime.json); python=$(jq -r .python runtime.json)
          for f in "$hermes" "$python"; do
            zstd -dc -- *.tar.zst | tar -xO "./$f" | head -c 2 | grep -q MZ || { echo "$f is not a PE file"; exit 1; }
          done
          ls -l
          jq -r '"runtime archive: \(.archive.size) bytes, unpacked about \(.unpacked_size) bytes, Hermes \(.hermes_version), Python \(.python_version), target \(.target)"' runtime.json | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          # not named boopis-*: the release job publishes only those
          name: hermes-runtime-windows-x86_64
          path: dist/runtime-windows/*
          if-no-files-found: error
          retention-days: 30

  windows:
    # macOS minutes count ten times and Windows twice: build them for tags and on demand, not every develop push
    if: ${{ inputs.from_run == '' && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') }}
    # Non-blocking. The installer carries what the Linux one does (hx.exe, the plugin, the Hermes runtime), staged by the same
    # scripts/stage-bundle.sh that scripts/build-windows.sh uses when it cross-builds this on Linux. Unsigned: SmartScreen asks.
    # What does not work on Windows yet (the secret channel, the sandbox's first run, mods) is in docs/RELEASING.md, "Windows".
    needs: runtime-windows
    runs-on: windows-latest
    continue-on-error: true
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with: { shared-key: release-windows }
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: apps/desktop/ui
      - name: build hx.exe (release), the sidecar
        run: cargo build --release -p hx --target x86_64-pc-windows-msvc
      - uses: actions/download-artifact@v4
        with:
          name: hermes-runtime-windows-x86_64
          path: ${{ runner.temp }}/runtime
      - name: stage the hx sidecar, the plugin and the Hermes runtime (scripts/stage-bundle.sh)
        run: scripts/stage-bundle.sh --target x86_64-pc-windows-msvc --runtime "$RUNNER_TEMP/runtime"
      - name: build the installer (NSIS, unsigned) with the bundle configs
        working-directory: apps/desktop/src-tauri
        run: |
          pnpm dlx @tauri-apps/cli@2 build --bundles nsis --target x86_64-pc-windows-msvc \
            --config tauri.bundle.conf.json --config tauri.bundle.windows.conf.json
      - name: the installer holds hx.exe, the plugin and the runtime
        run: |
          installer=$(ls target/x86_64-pc-windows-msvc/release/bundle/nsis/boopis_*_x64-setup.exe)
          7z l -ba "$installer" | tr '\\' '/' | tee list.txt | grep -c . 
          for want in 'hx.exe' 'plugin/boopis/plugin.yaml' 'runtime/runtime.json' 'runtime/hermes-runtime-windows-x86_64.tar.zst'; do
            grep -q "$want\$" list.txt || { echo "the installer does not hold $want"; exit 1; }
          done
          echo "installer: $(stat -c %s "$installer") bytes" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: boopis-windows-x86_64-nsis
          path: target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30

  macos:
    # macOS minutes count ten times and Windows twice: build them for tags and on demand, not every develop push
    if: ${{ inputs.from_run == '' && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') }}
    # Non-blocking. Apple silicon (macos-latest): the Hermes runtime for macos-aarch64, built here natively by
    # scripts/build-runtime.sh and proved relocatable, hx for aarch64-apple-darwin and the plugin, staged by the same
    # scripts/stage-bundle.sh as the Linux and Windows jobs, then boopis.app and the dmg with tauri.bundle.macos.conf.json.
    # Signed with a Developer ID, the runtime's nested code included, and notarised when the repository has the Apple secrets
    # (docs/RELEASING.md, "macOS"); without them the app is signed ad hoc, which the summary says. `macos-smoke` installs it.
    runs-on: macos-latest
    continue-on-error: true
    timeout-minutes: 75
    # A job with continue-on-error reports `success` to the jobs that need it even when it failed, so the jobs after it read
    # this output instead: true only once the dmg is checked and uploaded.
    outputs:
      built: ${{ steps.built.outputs.built }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.0"  # = bundle.macOS.minimumSystemVersion; hx is built by cargo itself
    steps:
      - uses: actions/checkout@v4
      - name: the tag matches the app's version
        if: env.RELEASE_TAG != ''
        run: |
          v=$(jq -r .version apps/desktop/src-tauri/tauri.conf.json)
          [ "$RELEASE_TAG" = "v$v" ] || { echo "tag $RELEASE_TAG but tauri.conf.json says $v"; exit 1; }
      - name: Developer ID signing and notarisation, when the repository has the secrets
        id: signing
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ] || [ -z "$APPLE_CERTIFICATE_PASSWORD" ] || [ -z "$APPLE_SIGNING_IDENTITY" ]; then
            { echo "sign=false"; echo "notarize=false"; } >> "$GITHUB_OUTPUT"
            echo "::notice title=macOS build not signed::APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD and APPLE_SIGNING_IDENTITY are not all set, so the app is signed ad hoc and not notarised (docs/RELEASING.md, macOS)."
            exit 0
          fi
          # a keychain of this job only, holding the Developer ID Application certificate; removed by the last step
          keychain="$RUNNER_TEMP/boopis-signing.keychain-db"
          pass="$(openssl rand -hex 24)"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security create-keychain -p "$pass" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$pass" "$keychain"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" -f pkcs12 -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/developer-id.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$pass" "$keychain" >/dev/null
          # shellcheck disable=SC2046 # the existing search list, one word per keychain
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$keychain" | grep -qF "$APPLE_SIGNING_IDENTITY" \
            || { echo "::error::the certificate in APPLE_CERTIFICATE holds no valid identity named by APPLE_SIGNING_IDENTITY"; exit 1; }
          { echo "sign=true"; echo "keychain=$keychain"; } >> "$GITHUB_OUTPUT"
          if [ -n "$APPLE_ID" ] && [ -n "$APPLE_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
            echo "notarize=true" >> "$GITHUB_OUTPUT"
          else
            echo "notarize=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=macOS build not notarised::APPLE_ID, APPLE_PASSWORD and APPLE_TEAM_ID are not all set: the app is signed but not notarised."
          fi
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: aarch64-apple-darwin
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with: { shared-key: release-macos }
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: apps/desktop/ui
      # The runtime is cached only while it is not signed: a signed build signs a fresh one with the certificate it has now.
      - uses: actions/cache@v4
        id: runtime-cache
        if: steps.signing.outputs.sign != 'true'
        with:
          path: dist/runtime-macos
          key: hermes-runtime-macos-aarch64-unsigned-${{ hashFiles('scripts/build-runtime.sh', 'scripts/verify-runtime.sh', 'scripts/macos-codesign.sh', 'scripts/runtime/**') }}
      - name: build hermes-runtime-macos-aarch64.tar.zst and runtime.json (scripts/build-runtime.sh, natively)
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        env:
          SIGN: ${{ steps.signing.outputs.sign }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          command -v gtar >/dev/null || brew install gnu-tar
          command -v zstd >/dev/null || brew install zstd
          if [ "$SIGN" = true ]; then
            scripts/build-runtime.sh --out dist/runtime-macos --codesign "$APPLE_SIGNING_IDENTITY"
          else
            scripts/build-runtime.sh --out dist/runtime-macos
          fi
      - name: relocation proof (unpacked in two paths, one with spaces; every signature valid, no foreign library path)
        run: scripts/verify-runtime.sh dist/runtime-macos
      - name: notarise the runtime's nested code (the archive is not a bundle, so Apple learns its signatures from a zip of it)
        if: steps.signing.outputs.notarize == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          payload="$RUNNER_TEMP/runtime-payload"; rm -rf "$payload"; mkdir -p "$payload"
          zstd -d -q -c dist/runtime-macos/hermes-runtime-macos-aarch64.tar.zst | tar -x -C "$payload"
          ditto -c -k --keepParent "$payload" "$RUNNER_TEMP/runtime-payload.zip"
          xcrun notarytool submit "$RUNNER_TEMP/runtime-payload.zip" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" --wait --output-format json | tee "$RUNNER_TEMP/runtime-notary.json"
          [ "$(jq -r .status "$RUNNER_TEMP/runtime-notary.json")" = Accepted ] || { echo "::error::the runtime was not accepted by the notary service"; exit 1; }
      - name: sizes
        run: |
          ls -l dist/runtime-macos
          jq -r '"macOS runtime archive: \(.archive.size) bytes, unpacked about \(.unpacked_size) bytes, Hermes \(.hermes_version), Python \(.python_version), target \(.target)"' dist/runtime-macos/runtime.json | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          # not named boopis-*: the release job publishes only those
          name: hermes-runtime-macos-aarch64
          path: dist/runtime-macos/*
          if-no-files-found: error
          retention-days: 30
      - name: build hx (release), the sidecar
        run: cargo build --release -p hx --target aarch64-apple-darwin
      - name: stage the hx sidecar, the plugin and the Hermes runtime (scripts/stage-bundle.sh)
        run: scripts/stage-bundle.sh --target aarch64-apple-darwin --runtime dist/runtime-macos
      # A nested helper built outside Tauri (the notch, docs/RELEASING.md "macOS") is signed here, before the bundle, with
      # scripts/macos-codesign.sh and its own entitlements; tauri.bundle.macos.conf.json's bundle.macOS.files puts it in
      # Contents/Helpers, and the app's signature then seals it.
      - name: build boopis.app and the dmg (Developer ID when the secrets exist, ad hoc otherwise; notarised and stapled by Tauri)
        working-directory: apps/desktop/src-tauri
        env:
          SIGN: ${{ steps.signing.outputs.sign }}
          NOTARIZE: ${{ steps.signing.outputs.notarize }}
          SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          NOTARY_APPLE_ID: ${{ secrets.APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          configs=(--config tauri.bundle.conf.json --config tauri.bundle.macos.conf.json)
          if [ "$SIGN" = true ]; then
            jq -n --arg id "$SIGNING_IDENTITY" '{bundle: {macOS: {signingIdentity: $id}}}' > "$RUNNER_TEMP/tauri.signing.json"
            configs+=(--config "$RUNNER_TEMP/tauri.signing.json")
          fi
          if [ "$NOTARIZE" = true ]; then
            export APPLE_ID="$NOTARY_APPLE_ID" APPLE_PASSWORD="$NOTARY_PASSWORD" APPLE_TEAM_ID="$NOTARY_TEAM_ID"
          fi
          pnpm dlx @tauri-apps/cli@2 build --bundles app,dmg --target aarch64-apple-darwin "${configs[@]}"
      - name: the bundle holds hx, the plugin and the runtime, and its signature is sound
        env:
          SIGN: ${{ steps.signing.outputs.sign }}
          NOTARIZE: ${{ steps.signing.outputs.notarize }}
        run: |
          out=target/aarch64-apple-darwin/release/bundle
          app="$out/macos/boopis.app"
          dmg=$(ls "$out"/dmg/boopis_*_aarch64.dmg)
          for want in MacOS/boopis MacOS/hx Resources/plugin/boopis/plugin.yaml Resources/runtime/runtime.json \
              Resources/runtime/hermes-runtime-macos-aarch64.tar.zst; do
            [ -e "$app/Contents/$want" ] || { echo "the app does not hold Contents/$want"; exit 1; }
          done
          for bin in boopis hx; do
            [ "$(lipo -archs "$app/Contents/MacOS/$bin")" = arm64 ] || { echo "Contents/MacOS/$bin is not arm64"; exit 1; }
          done
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign --display --verbose=2 "$app" 2>&1 | grep -E '^(Identifier|Authority|TeamIdentifier|Signature|CodeDirectory)'
          codesign --display --entitlements - --xml "$app" | plutil -p - || echo "::warning::the app carries no entitlements"
          hdiutil verify "$dmg"
          if [ "$NOTARIZE" = true ]; then
            xcrun stapler validate "$app"
            spctl --assess --type execute --verbose=2 "$app"
            signed="signed with a Developer ID and notarised (Gatekeeper opens it)"
          elif [ "$SIGN" = true ]; then
            signed="signed with a Developer ID, not notarised (Gatekeeper asks)"
          else
            signed="NOT signed: ad hoc only, no Developer ID and no notarisation, because the repository has no Apple signing secrets (Gatekeeper refuses it from a browser download until the person allows it; scripts/install.sh is not affected)"
          fi
          {
            echo "macOS dmg: $(stat -f %z "$dmg") bytes, $signed"
            echo "of which the Hermes runtime archive: $(jq .archive.size dist/runtime-macos/runtime.json) bytes"
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: boopis-macos-aarch64-dmg
          path: target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 30
      - name: the dmg is built, checked and uploaded
        id: built
        run: echo "built=true" >> "$GITHUB_OUTPUT"
      - name: remove the signing keychain
        if: always() && steps.signing.outputs.sign == 'true'
        env:
          KEYCHAIN: ${{ steps.signing.outputs.keychain }}
        run: security delete-keychain "$KEYCHAIN" || true

  macos-smoke:
    # The dmg on a clean Mac, as a person gets it (tests/e2e/smoke_macos.sh: scripts/install.sh, the bundle, `boopis
    # --version`, the app started with the Local API on, one app per user), then the engine on the bundle's own runtime and
    # hx (tests/setup_live.rs: the host's unpack, the plugin, the gateway, the secret channel through the macOS peer check, a
    # governed session against the fake model), the plugin's exec kernel in the bundle's Seatbelt sandbox, hx-sandbox's own
    # macOS tests and the host's unit tests of the macOS process table. Non-blocking like the build for now; `release`
    # attaches the dmg only when this passed. With `from_run` the dmg is the earlier run's and the scripts are this commit's.
    if: ${{ !cancelled() && (needs.macos.outputs.built == 'true' || (needs.reuse.result == 'success' && needs.reuse.outputs.has_macos == 'true')) }}
    needs: [macos, reuse]
    runs-on: macos-latest
    continue-on-error: true
    timeout-minutes: 60
    # what `release` reads (continue-on-error makes the job's own result `success` whatever happened): true only from the verdict
    outputs:
      passed: ${{ steps.verdict.outputs.passed }}
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: boopis-macos-aarch64-dmg
          path: ${{ runner.temp }}/dmg
          run-id: ${{ inputs.from_run || github.run_id }}
          github-token: ${{ github.token }}
      - name: install the dmg and start the app (tests/e2e/smoke_macos.sh)
        id: app
        continue-on-error: true
        timeout-minutes: 15
        run: tests/e2e/smoke_macos.sh "$(ls "$RUNNER_TEMP"/dmg/boopis_*_aarch64.dmg)" "$RUNNER_TEMP/smoke"
      - uses: astral-sh/setup-uv@v5
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
        with: { shared-key: live-signins-macos }  # the same debug build of the host as live-signins.yml's macOS probe
      - name: the bundle's runtime, unpacked for the plugin's tests (the archive the app carries)
        id: runtime
        if: env.BOOPIS_RUNTIME_DIR != ''
        run: |
          command -v zstd >/dev/null || brew install zstd
          dir="$RUNNER_TEMP/hermes-runtime"; mkdir -p "$dir"
          zstd -d -q -c "$BOOPIS_RUNTIME_DIR"/hermes-runtime-macos-aarch64.tar.zst | tar -x -C "$dir"
          echo "HX_E2E_RUNTIME=$dir" >> "$GITHUB_ENV"
      - name: contraprova's CLI at the vendored commit (the plugin's tests verify a ledger with it)
        env:
          CONTRAPROVA_TOKEN: ${{ secrets.CONTRAPROVA_TOKEN }}
        run: |
          sha=$(jq -r .sha plugins/boopis/_vendor/contraprova/VENDOR.json)
          auth=""
          if [ -n "$CONTRAPROVA_TOKEN" ]; then
            echo "::add-mask::$CONTRAPROVA_TOKEN"
            auth="x-access-token:${CONTRAPROVA_TOKEN}@"
          fi
          echo "CONTRAPROVA_SPEC=contraprova @ git+https://${auth}github.com/aphesist/contraprova@${sha}" >> "$GITHUB_ENV"
      - name: exec in the bundle's sandbox (the plugin's kernel under hx's Seatbelt profile, the short channel folder)
        id: exec
        timeout-minutes: 20
        if: env.HX_E2E_RUNTIME != ''
        continue-on-error: true
        working-directory: plugins/boopis
        env:
          HX_E2E_RUNTIME_ROOT: ${{ env.HX_E2E_RUNTIME }}
        run: |
          uv run --no-project --python 3.11 --with pytest --with hypothesis --with ruamel.yaml --with "$CONTRAPROVA_SPEC" \
            pytest -q -rs tests/test_exec_sandbox.py tests/test_exec_sockdir.py
      - name: first-run setup on the bundle's runtime and hx (tests/setup_live.rs, the host's own unpack and the fake model)
        id: setup
        timeout-minutes: 20
        if: env.HX_BIN != ''
        continue-on-error: true
        env:
          HX_E2E_RUNTIME_ARCHIVE: ${{ env.BOOPIS_RUNTIME_DIR }}
        run: |
          set -o pipefail
          cargo test -p boopis-host --test setup_live first_run_setup_end_to_end_on_the_bundled_runtime -- --exact --nocapture 2>&1 \
            | tee "$RUNNER_TEMP/setup_live.log"
          if grep -q 'skipped:' "$RUNNER_TEMP/setup_live.log"; then echo "::error::setup_live skipped instead of running"; exit 1; fi
          grep -q 'test result: ok. [1-9]' "$RUNNER_TEMP/setup_live.log"
      - name: the host's macOS process table for the secret channel, and its other unit tests of secrets
        id: peer
        timeout-minutes: 20
        continue-on-error: true
        run: |
          cargo test -p boopis-host --lib secrets:: -- --nocapture
      - name: hx-sandbox's own macOS tests (the Seatbelt backend, each assertion made inside the sandbox)
        id: sandbox
        timeout-minutes: 20
        continue-on-error: true
        run: |
          cargo build -p hx-sandbox --examples
          cargo test -p hx-sandbox --test macos -- --nocapture
      - name: the plugin's end-to-end suite on the bundle's runtime (informational on macOS for now)
        id: e2e
        timeout-minutes: 20
        if: env.HX_E2E_RUNTIME != ''
        continue-on-error: true
        working-directory: plugins/boopis
        run: |
          PYTHONPATH="$HX_E2E_RUNTIME/hermes-agent" \
          uv run --no-project --python 3.11 --with pytest --with hypothesis --with ruamel.yaml --with "$CONTRAPROVA_SPEC" \
            pytest -q -rs ../../tests/e2e
      - name: verdict
        id: verdict
        env:
          APP: ${{ steps.app.outcome }}
          EXEC: ${{ steps.exec.outcome }}
          SETUP: ${{ steps.setup.outcome }}
          PEER: ${{ steps.peer.outcome }}
          SANDBOX: ${{ steps.sandbox.outcome }}
          E2E: ${{ steps.e2e.outcome }}
        run: |
          {
            echo "### macOS smoke"
            echo "| check | result |"
            echo "|---|---|"
            echo "| install, bundle, app, Local API, one app per user (smoke_macos.sh) | $APP |"
            echo "| exec in the Seatbelt sandbox (plugin tests, bundle's hx) | $EXEC |"
            echo "| first-run setup on the bundle's runtime (setup_live) | $SETUP |"
            echo "| secret channel's process table (host unit tests) | $PEER |"
            echo "| hx-sandbox macOS tests | $SANDBOX |"
            echo "| plugin end-to-end suite (informational) | $E2E |"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          for r in "$APP" "$EXEC" "$SETUP" "$PEER" "$SANDBOX"; do [ "$r" = success ] || exit 1; done
          echo "passed=true" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-smoke
          path: |
            ${{ runner.temp }}/smoke/*.png
            ${{ runner.temp }}/smoke/*.log
            ${{ runner.temp }}/smoke/*.txt
            ${{ runner.temp }}/smoke/*.json
            ${{ runner.temp }}/setup_live.log
          if-no-files-found: ignore
          retention-days: 7

  release:
    # Tags only: a GitHub release with the AppImage, whatever extra bundles built (the Arch package and the dmg only when their
    # smoke tests passed), the two installers, and SHA256SUMS over all of them. The AppImage and its smoke test are what the
    # release waits on; the others are attached if they built.
    # With `from_run` it publishes the artifacts of that earlier run (smoke-tested above with this commit's scripts), not a build of this one.
    if: ${{ !cancelled() && (needs.linux.result == 'success' || needs.reuse.result == 'success') && needs.smoke.result == 'success' && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release != '')) }}
    needs: [reuse, linux, smoke, windows, macos, macos-smoke, arch, arch-smoke]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
      - uses: actions/download-artifact@v4
        with:
          pattern: boopis-*
          path: release-files
          merge-multiple: true
          run-id: ${{ inputs.from_run || github.run_id }}
          github-token: ${{ github.token }}
      - name: the installers go next to the artifacts (before the checksums, so SHA256SUMS covers them)
        run: cp scripts/install.sh scripts/install.ps1 release-files/
      - name: the Arch package is published only when its smoke test passed
        if: ${{ needs.arch-smoke.result != 'success' }}
        run: rm -f release-files/*.pkg.tar.zst
      - name: the dmg is published only when the macOS smoke test passed
        if: ${{ needs.macos-smoke.outputs.passed != 'true' }}
        run: rm -f release-files/*.dmg
      - name: checksums over every file
        working-directory: release-files
        run: |
          rm -f SHA256SUMS
          sha256sum -- * | tee ../SHA256SUMS
          mv ../SHA256SUMS .
      - name: create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ARTIFACTS_SHA: ${{ needs.reuse.outputs.sha }}  # set with from_run: the commit that built the files
        # Before 1.0, and for any tag with a suffix (v1.2.0-rc.1), the release is a pre-release. The installers take the newest
        # pre-release while there is no other (scripts/install.sh, install.ps1: GitHub's "latest" never answers with one).
        run: |
          pre=()
          case "$RELEASE_TAG" in v0.*|*-*) pre=(--prerelease) ;; esac
          # A pushed tag must exist already; a manual run creates its tag on the commit this run built (GITHUB_SHA), and a run
          # from an earlier one on the commit that built the files it publishes (they may differ from this one only in tests and docs).
          if [ "$GITHUB_REF_TYPE" = tag ]; then where=(--verify-tag); else where=(--target "${ARTIFACTS_SHA:-$GITHUB_SHA}"); fi
          gh release create "$RELEASE_TAG" release-files/* \
            --title "$RELEASE_TAG" --generate-notes "${where[@]}" "${pre[@]}"
