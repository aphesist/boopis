name: desktop-window
# The built app's own window, on a fresh profile (tests/e2e/smoke_window.py): first run shows the window's controls laid out
# for the desktop, the drag region's double click is allowed, and Close quits. On Windows it also checks the undecorated
# window through the Win32 API (Snap's styles, the resize edges, Maximize, a double click on the bar, Minimize, Win+Left,
# Close); on Linux it runs again as a tiling desktop (close alone). The app is a debug build with the UI embedded; no engine
# is installed, so first run stays on its welcome. macOS is left out: WebDriver cannot drive a WKWebView app.
# Runs as part of ci.yml's gate, and alone on any branch: `gh workflow run desktop-window.yml --ref <branch>`.
on:
  workflow_dispatch:
  workflow_call:
  # TEMPORARY: a workflow GitHub has not seen on the default branch cannot be dispatched, so this branch runs it on push
  # until it is merged. Removed before the merge.
  push:
    branches: [w24/first-run-window]
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTUP_TOOLCHAIN: "1.97.0"

jobs:
  window:
    # NON-BLOCKING for now, like ci.yml's `appimage` and `desktop-smoke`: it is new, and the first Windows run of the app
    # itself. continue-on-error keeps the caller's result green when it fails; the failure still shows red on the run. Remove
    # it once both have been green for a few runs.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
        # kept when the job fails too, so the next run of a red job does not build everything again
        with: { shared-key: "desktop-window-${{ matrix.os }}", cache-on-failure: true }
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: apps/desktop/ui
      - name: Tauri's Linux prerequisites, Xvfb and WebKitWebDriver
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            build-essential pkg-config xvfb webkit2gtk-driver
      - name: build the app (a debug build with the UI embedded)
        if: runner.os == 'Linux'
        working-directory: apps/desktop/src-tauri
        run: pnpm dlx @tauri-apps/cli@2 build --debug --no-bundle
      # WebView2 ignores the debugging switch WebDriver passes in WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS once an app names its
      # own browser arguments, as every Tauri app does, so this test build names it: tauri.conf.json's main window, as it
      # is, plus `additionalBrowserArgs` (wry's default arguments and the port). What ships is built without it.
      - name: build the app (a debug build with the UI embedded and the web view's debugging port)
        if: runner.os == 'Windows'
        working-directory: apps/desktop/src-tauri
        run: |
          python - <<'PY'
          import json, os
          conf = json.load(open("tauri.conf.json"))
          main = dict(conf["app"]["windows"][0])
          main["additionalBrowserArgs"] = "--disable-features=msWebOOUI,msPdfOOUI,msSmartScreenProtection --remote-debugging-port=9222"
          json.dump({"app": {"windows": [main]}}, open(os.path.join(os.environ["RUNNER_TEMP"], "debug-port.json"), "w"))
          PY
          pnpm dlx @tauri-apps/cli@2 build --debug --no-bundle --config "$RUNNER_TEMP/debug-port.json"
      - name: the msedgedriver of the WebView2 runtime on this runner
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $id = '{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $ver = $null
          foreach ($k in "HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\$id", "HKLM:\SOFTWARE\Microsoft\EdgeUpdate\Clients\$id", "HKCU:\Software\Microsoft\EdgeUpdate\Clients\$id") {
            if (-not $ver) { $ver = (Get-ItemProperty -Path $k -ErrorAction SilentlyContinue).pv }
          }
          Write-Output "WebView2 runtime: $ver"
          $dir = Join-Path $env:RUNNER_TEMP 'edgedriver'
          try {
            Invoke-WebRequest "https://msedgedriver.microsoft.com/$ver/edgedriver_win64.zip" -OutFile "$dir.zip"
            Expand-Archive "$dir.zip" -DestinationPath $dir -Force
            $driver = Join-Path $dir 'msedgedriver.exe'
          } catch {
            Write-Output "no msedgedriver $ver to download ($_); using the runner's own"
            $driver = Join-Path $env:EDGEWEBDRIVER 'msedgedriver.exe'
          }
          & $driver --version
          "MSEDGEDRIVER=$driver" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: first run's window on Windows (the controls, the Win32 checks)
        if: runner.os == 'Windows'
        run: python tests/e2e/smoke_window.py target/debug/boopis.exe --shot "$RUNNER_TEMP/window-windows.png"
      - name: when the Windows smoke fails, the app without a driver (its web view's processes, debugging port and folders)
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:BOOPIS_HERMES = 'existing'
          $p = Start-Process -FilePath target\debug\boopis.exe -PassThru
          Start-Sleep -Seconds 45
          Get-CimInstance Win32_Process | Where-Object { $_.Name -match 'msedgewebview2|boopis' } | ForEach-Object { '{0} {1}: {2}' -f $_.ProcessId, $_.Name, $_.CommandLine }
          (Get-Process -Id $p.Id -ErrorAction SilentlyContinue) | Select-Object Id, MainWindowTitle, Responding | Format-List
          try { (Invoke-WebRequest http://127.0.0.1:9222/json/version -UseBasicParsing -TimeoutSec 10).Content } catch { "no debugging port 9222: $_" }
          Get-ChildItem -Recurse -Force -Filter DevToolsActivePort -Path $env:LOCALAPPDATA, $env:TEMP, (Resolve-Path target\debug) -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName; Get-Content $_.FullName }
          Get-ChildItem -Force "$env:LOCALAPPDATA\dev.aphesist.boopis" -ErrorAction SilentlyContinue
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
      - name: first run's window on Linux (a floating desktop, then a tiling one)
        if: runner.os == 'Linux'
        run: |
          python3 tests/e2e/smoke_window.py target/debug/boopis --shot "$RUNNER_TEMP/window-linux.png"
          python3 tests/e2e/smoke_window.py target/debug/boopis --tiling --shot "$RUNNER_TEMP/window-linux-tiling.png"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-window-${{ matrix.os }}
          path: ${{ runner.temp }}/window-*.png
          if-no-files-found: ignore
          retention-days: 7
