name: hypotaxis
version: 0.1.0
manifest_version: 2
description: "Governed execution plane for Hermes: permission policy, a hash-chained ledger in contraprova's format, a cost cap and a plugin RPC namespace (plugin.hypotaxis.*)."
author: aphesist
license: Apache-2.0
kind: standalone
requires_hermes: ">=0.23.2"
# exec arrives in a later part; nothing is declared before it is registered.
provides_tools:
  - pack
  - ship
  - dispatch
provides_hooks:
  - pre_tool_call
  - post_tool_call
  - post_api_request
  - post_auxiliary_call
  - pre_llm_call
  - on_session_start
  - on_session_finalize
  # compat/: the Claude Code hooks bridge (docs/COMPAT.md section 4)
  - transform_tool_result
  - post_llm_call
  - on_session_open
  - on_session_reset
  - post_compaction
  - subagent_start
  - subagent_stop
  - on_human_input_request
# Nothing here needs a granted capability: no tool override, no host-owned LLM calls.
capabilities: []
config_schema:
  mode:
    type: string
    default: governed
    description: "Mode of new sessions: governed (only hypotaxis tools plus read-only Hermes tools) or ungoverned. Locked at the first prompt of a session."
  ladder:
    type: object
    description: "Tier ladder, cheapest first: {same_tier_scope_retry, tiers: [{name, model: 'provider/id', effort, max_tokens, retries}]}. Each tier names a Hermes provider by its configured name (never `custom`). Unset means contraprova's measured Claude ladder (haiku, sonnet, opus on `anthropic`). Governed mode needs delegation.backend: hypotaxis in Hermes's config."
  start_tier:
    type: string
    description: "The tier a governed task starts at (a name from the ladder). Unset means the first. Escalation climbs from there."
  forks:
    type: boolean
    default: false
    description: "contraprova's control replicates (a study feature). Not yet supported: dispatch refuses while this is true."
  cascade:
    type: object
    description: "What the next tier is told after a block: {output_tail_chars (default 3000), diff_chars (default 6000)}, and brief_max_chars (default 8000), the longest brief dispatch accepts."
  cost_cap_usd:
    type: number
    description: "Block new turns once a session's spend reaches this many US dollars. Unset means no cap. Dollars are computed from tokens and the price table, never stored."
  prices:
    type: object
    description: "Where rates come from: {refresh_enabled: bool (default true; lets prices.refresh fetch models.dev), overrides: {'provider/model': {input, output, cache_read, cache_write_5m, cache_write_1h, reasoning}} in USD per million tokens, aliases: {hermes_provider: models.dev provider id}}. The catalogue is <profile home>/hypotaxis/prices/models-dev.json."
  subscription_providers:
    type: list
    default: []
    description: "Providers billed to a plan. Their usage costs zero against the cap and is recorded with subscription: true."
  permissions:
    type: object
    description: "Permission rules: {allow: [], ask: [], deny: [], default: allow|ask|deny}, in Claude Code's Tool(specifier) syntax. deny beats ask beats allow."
  pack:
    type: object
    description: "The pack tool: {max_bytes: byte budget of one call, default 131072}."
  hx_path:
    type: string
    default: ""
    description: "Path to the hx binary. Empty means look it up on PATH."
  ledger_dir:
    type: string
    default: ""
    description: "Directory of ledger files. Empty means <profile home>/hypotaxis/ledger."
